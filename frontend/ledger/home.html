<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ภาพรวม · สมุดจด</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  หน้าภาพรวมใหม่ (2026-10-10 · North เลือก: สีแบบ 4 + เนื้อหาแบบ 1 + สรุปทุกบริษัท (แบบ 4) + สินทรัพย์/หนี้สิน (แบบ 5))
  ข้อมูล: GET /api/dashboard/summary?month=&member= (ชุดเดียวกับภาพรวมเดิม) · GET /api/inbox · GET /api/inbox/statements
  ตัวเลข: ทศนิยม 2 ตำแหน่ง · , หลักพัน · ติดลบในวงเล็บสีแดง
-->
<style>
  :root { --ink: #212529; --muted: #5c636a; --line: #ece8f8; --bg: #f8f7fd; --card: #fff; --brand: #5f3dc4; --brand2: #7950f2;
    --pos: #087f5b; --neg: #c92a2a; --warn: #b35c00; --radius: 22px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Anuphan', -apple-system, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
  body { padding-bottom: 40px; }
  button, select { font: inherit; color: inherit; }
  a { color: var(--brand); }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
  .top { background: linear-gradient(135deg, #5f3dc4, #7950f2 60%, #9775fa); color: #fff; padding: 18px 0 64px; }
  .top .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .top h1 { margin: 0; font-size: 24px; }
  .top p { margin: 2px 0 0; font-size: 14px; color: #e5dbff; }
  .nav { display: flex; gap: 6px; flex-wrap: wrap; }
  .nav a { color: #fff; text-decoration: none; background: rgba(255,255,255,.18); padding: 10px 14px; border-radius: 12px; font-size: 14px; font-weight: 600; min-height: 44px; display: inline-flex; align-items: center; gap: 6px; }
  .nav a.on { background: #fff; color: var(--brand); }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; background: #fff; border-radius: 18px; padding: 8px; margin-top: -44px;
    box-shadow: 0 8px 24px rgba(95,61,196,.12); position: relative; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1.5px solid var(--line); background: #fff; border-radius: 12px; padding: 8px 14px; cursor: pointer; min-height: 44px; font-weight: 600; }
  .chip.on { background: var(--brand); border-color: var(--brand); color: #fff; }
  .month { display: flex; align-items: center; gap: 6px; }
  .month button { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--line); background: #fff; cursor: pointer; font-size: 18px; }
  .month b { min-width: 92px; text-align: center; }
  .grid { display: grid; gap: 16px; margin-top: 16px; }
  .g2 { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
  .card { background: var(--card); border-radius: var(--radius); padding: 20px; box-shadow: 0 1px 0 var(--line), 0 6px 20px rgba(95,61,196,.05); min-width: 0; }
  .card h2 { margin: 0 0 12px; font-size: 16px; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .todo { background: linear-gradient(135deg, #5f3dc4, #7048e8); color: #fff; border-radius: var(--radius); padding: 18px; margin-top: 16px; }
  .todo h2 { margin: 0 0 12px; font-size: 18px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .todo h2 small { font-weight: 400; color: #e5dbff; font-size: 14px; }
  .tasks { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
  .task { background: #fff; color: var(--ink); border-radius: 16px; padding: 14px; text-decoration: none; display: flex; gap: 12px; align-items: center; min-height: 84px; }
  .task .ic { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; flex: none; }
  .task b { display: block; font-size: 20px; }
  .task span { font-size: 13px; color: var(--muted); }
  .task.done { opacity: .75; }
  .alldone { background: rgba(255,255,255,.15); border-radius: 14px; padding: 14px; display: flex; align-items: center; gap: 10px; font-weight: 600; }
  .big { font-size: 36px; font-weight: 700; letter-spacing: -.5px; }
  .kv { display: flex; justify-content: space-between; gap: 10px; padding: 11px 0; border-bottom: 1px solid #f3f0ff; align-items: center; }
  .kv:last-child { border-bottom: 0; }
  .kv span { display: inline-flex; align-items: center; gap: 8px; }
  .kv small { color: var(--muted); }
  .kv.total { font-size: 18px; font-weight: 700; }
  .pos { color: var(--pos); } .neg { color: var(--neg); } .mut { color: var(--muted); }
  .tiles3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .tile { border-radius: 14px; padding: 12px; background: #f8f9fa; min-width: 0; }
  .tile div:first-child { font-size: 13px; }
  .tile div:last-child { font-size: clamp(14px, 3.9vw, 19px); font-weight: 700; overflow-wrap: anywhere; }
  @media (max-width: 420px) { .tile { padding: 10px 8px; } }
  .barrow { display: flex; flex-direction: column; gap: 5px; margin-top: 10px; }
  .barrow .t { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
  .barrow .t span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .track { height: 10px; border-radius: 99px; background: #f3f0ff; overflow: hidden; }
  .track i { display: block; height: 100%; border-radius: 99px; }
  .net { background: var(--brand); color: #fff; }
  .net h2 { color: #e5dbff; }
  .net .meter { height: 12px; border-radius: 99px; background: rgba(255,255,255,.25); overflow: hidden; margin-top: 12px; }
  .net .meter i { display: block; height: 100%; background: #ffc9c9; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; min-width: 620px; }
  th { color: var(--muted); font-weight: 600; text-align: right; padding: 10px 8px; font-size: 13px; }
  th:first-child, td:first-child { text-align: left; }
  td { padding: 11px 8px; border-top: 1px solid #f3f0ff; text-align: right; white-space: nowrap; }
  tfoot td { font-weight: 700; border-top: 2px solid var(--line); }
  .scroll { overflow-x: auto; }
  .accs { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
  .acc { border: 1.5px solid #f3f0ff; border-radius: 16px; padding: 12px 14px; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  .acc.bad { border-color: #ffc9c9; background: #fff5f5; }
  .acc div { min-width: 0; }
  .acc .n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acc small { color: var(--muted); }
  .more { border: 0; background: #f3f0ff; color: var(--brand); border-radius: 12px; padding: 10px 14px; font-weight: 600; cursor: pointer; min-height: 44px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 20px; }
  .loading { text-align: center; padding: 60px 20px; color: var(--muted); }
  svg.i { width: 22px; height: 22px; flex: none; }
  /* ── จอใหญ่ Mac/PC: ขยายทั้งหน้า + ตัวอักษรเข้มคมขึ้น (มือถือ/iPad ไม่เปลี่ยน) ── */
  @media (min-width: 1024px) and (hover: hover) and (pointer: fine) {
    :root { --muted: #464c53; }
    html, body { -webkit-font-smoothing: auto; -moz-osx-font-smoothing: auto; }
    html { zoom: 1.1; }
  }
  @media (min-width: 1280px) and (hover: hover) and (pointer: fine) { html { zoom: 1.2; } }
  @media (min-width: 1600px) and (hover: hover) and (pointer: fine) { html { zoom: 1.3; } }
</style>
</head>

</div></div>

  <div class="bar">
    <div class="chips" id="members" role="tablist" aria-label="สมาชิก"></div>
    <div class="month"><button id="prevM" aria-label="เดือนก่อน">‹</button><b id="monthL">—</b><button id="nextM" aria-label="เดือนถัดไป">›</button></div>
  </div>

<script>
/* ⏱️ ทุกคำขอมีเวลารอสูงสุด (2026-10-11) — เดิมถ้าเซิร์ฟเวอร์ค้าง หน้าจอหมุนไม่รู้จบ
   อ่านเอกสาร/statement ด้วย AI ใช้เวลานาน ให้รอได้ 3 นาที · อย่างอื่น 40 วินาที
   และแปลง error ให้อ่านรู้เรื่อง แทน "Failed to fetch" */
(function () {
  const orig = window.fetch.bind(window);
  window.fetch = (input, init = {}) => {
    if (init.signal || typeof AbortController === 'undefined') return orig(input, init);
    const url = typeof input === 'string' ? input : (input?.url || '');
    const ms = /\/(upload|statement|import|retry|backup|restore|ocr)/i.test(url) ? 180000 : 40000;
    const ac = new AbortController();
    const timer = setTimeout(() => ac.abort(), ms);
    return orig(input, { ...init, signal: ac.signal })
      .catch(err => {
        if (err?.name === 'AbortError') throw new Error('เซิร์ฟเวอร์ตอบช้าเกินไป — ลองใหม่อีกครั้ง');
        if (err instanceof TypeError) throw new Error('เชื่อมต่อไม่ได้ — ตรวจอินเทอร์เน็ตแล้วลองใหม่');
        throw err;
      })
      .finally(() => clearTimeout(timer));
  };
})();
</script>
<script>
(function () {
  'use strict';
  const API = (() => {
    const PROD = 'https://record-revenue.9nimz.workers.dev';
    try {
      const q = new URLSearchParams(location.search).get('api');
      if (q) sessionStorage.setItem('api_base_override', q);
      const o = sessionStorage.getItem('api_base_override');
      if (o) return o.replace(/\/$/, '');
      if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') return 'http://localhost:8787';
    } catch (e) { /* ใช้ของจริง */ }
    return PROD;
  })();
  const token = () => { try { return localStorage.getItem('session_token') || sessionStorage.getItem('session_token') || ''; } catch { return ''; } };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
  const money = n => Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  /* กติกาตัวเลขทั้งแอป: ทศนิยม 2 · , หลักพัน · ติดลบในวงเล็บ สีแดง */
  const fmt = n => r2(n) < 0 ? `(${money(-r2(n))})` : money(n);
  const num = (n, opts = {}) => `<span class="${r2(n) < 0 ? 'neg' : opts.pos && r2(n) > 0 ? 'pos' : ''}">${fmt(n)}</span>`;
  const MONTHS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
  const monthLabel = m => { const [y, mm] = m.split('-').map(Number); return `${MONTHS[mm - 1]} ${String(y + 543).slice(2)}`; };
  const shiftMonth = (m, d) => { const [y, mm] = m.split('-').map(Number); const t = new Date(Date.UTC(y, mm - 1 + d, 1)); return t.toISOString().slice(0, 7); };
  const displayName = s => String(s || '').replace(/^\s*\[[^\]]+\]\s*/, '').trim() || String(s || '');
  const $ = s => document.querySelector(s);
  const ICON = {
    inbox: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5 5h14l3 7v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/>',
    tag: '<path d="M20 12l-8 8-9-9V3h8z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
    alert: '<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/>',
    file: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',
    bank: '<path d="M3 10h18M5 10v8M9 10v8M15 10v8M19 10v8M3 20h18M12 3l9 5H3z"/>',
    card: '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',
    trend: '<path d="M3 17l6-6 4 4 8-8M14 7h7v7"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 20c2-3 5-4 8-4s6 1 8 4"/>',
    build: '<path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"/>',
    check: '<circle cx="12" cy="12" r="10"/><path d="M8 12l3 3 5-6"/>',
  };
  const icon = (k, color) => `<svg class="i" viewBox="0 0 24 24" fill="none" stroke="${color || 'currentColor'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>`;

  const today = new Date(Date.now() + 7 * 3600e3).toISOString().slice(0, 10);
  const S = { month: today.slice(0, 7), member: 'ALL', showAll: false, data: null, inbox: [], statements: [], parties: null };

  async function get(path) {
    const res = await fetch(API + path, { headers: { Authorization: `Bearer ${token()}` } });
    if (res.status === 401) throw Object.assign(new Error('login'), { login: true });
    const d = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(d.error || `ผิดพลาด (${res.status})`);
    return d;
  }

  async function load() {
    if (!token()) return showLogin();
    $('#monthL').textContent = monthLabel(S.month);
    $('#nextM').disabled = S.month >= today.slice(0, 7);
    try {
      const [sum, box, st, pt] = await Promise.all([
        get(`/api/dashboard/summary?month=${S.month}&period=month&member=${encodeURIComponent(S.member)}`),
        get('/api/inbox').catch(() => ({ docs: [] })),
        get('/api/inbox/statements').catch(() => ({ statements: [] })),
        get('/api/inbox/parties').catch(() => null),
      ]);
      S.data = sum; S.inbox = box.docs || []; S.statements = st.statements || []; S.parties = pt?.totals ? pt : null;
      render();
    } catch (e) {
      if (e.login) return showLogin();
      $('#view').innerHTML = `<div class="card empty" style="margin-top:16px">โหลดไม่สำเร็จ: ${esc(e.message)}</div>`;
    }
  }
  function showLogin() {
    $('#asof').textContent = '';
    $('#view').innerHTML = `<div class="card empty" style="margin-top:16px"><h3>ยังไม่ได้เข้าสู่ระบบ</h3><p>เข้าสู่ระบบที่แอปหลักก่อน แล้วกลับมาหน้านี้</p>
      <p><a class="more" style="display:inline-block;text-decoration:none" href="../index.html">ไปหน้าเข้าสู่ระบบ</a></p></div>`;
  }

  function render() {
    const d = S.data;
    const me = (d.members || []).find(m => m.user_id === S.member);
    $('#hello').textContent = me ? `ภาพรวม · ${me.name}` : 'ภาพรวม · ทั้งครอบครัว';
    $('#asof').textContent = `ข้อมูลถึง ${d.range?.last_date || '-'} · ${Number(d.range?.count || 0).toLocaleString('en-US')} รายการ`;
    $('#members').innerHTML = [{ user_id: 'ALL', name: 'ทั้งครอบครัว' }, ...(d.members || [])].map(m =>
      `<button class="chip ${S.member === m.user_id ? 'on' : ''}" role="tab" aria-selected="${S.member === m.user_id}" data-m="${esc(m.user_id)}">${esc(m.name)}</button>`).join('');
    $('#members').querySelectorAll('[data-m]').forEach(b => b.onclick = () => { S.member = b.dataset.m; load(); });

    const accs = (d.accounts || []).map(a => ({ ...a, name: displayName(a.name), balance: r2(a.balance) }));
    const cash = accs.filter(a => a.account_type !== 'CREDIT');
    const credit = accs.filter(a => a.account_type === 'CREDIT');
    const cashSum = r2(cash.reduce((t, a) => t + a.balance, 0));
    const creditOwed = r2(credit.reduce((t, a) => t + (a.balance < 0 ? -a.balance : 0), 0));
    const creditOver = r2(credit.reduce((t, a) => t + (a.balance > 0 ? a.balance : 0), 0));
    // ลูกหนี้/เจ้าหนี้: ใช้ตัวเลขชุดเดียวกับแท็บ 🤝 ลูกหนี้ (ทุกสมาชิกที่มีสิทธิ์) · ถ้าโหลดไม่ได้ใช้ของภาพรวมเดิม
    const arSum = S.parties ? r2(S.parties.totals.ar) : r2((d.ar || []).reduce((t, x) => t + x.amount, 0));
    const apSum = S.parties ? r2(S.parties.totals.ap) : r2((d.ap || []).reduce((t, x) => t + x.amount, 0));
    const arN = S.parties ? S.parties.totals.ar_n : (d.ar || []).length, apN = S.parties ? S.parties.totals.ap_n : (d.ap || []).length;
    const invNet = r2(-(d.investment || []).reduce((t, x) => t + Number(x.amount || 0), 0));
    const assets = r2(cashSum + arSum + creditOver);
    const debts = r2(creditOwed + apSum);
    const net = r2(assets - debts);
    const inc = r2((d.income || []).reduce((t, x) => t + Number(x.amount || 0), 0));
    const exp = r2((d.expense || []).reduce((t, x) => t + Number(x.amount || 0), 0));   // ติดลบ
    const isNow = S.month === today.slice(0, 7);
    const [yy, mm] = S.month.split('-').map(Number);
    const daysIn = new Date(Date.UTC(yy, mm, 0)).getUTCDate();
    const days = isNow ? Number(today.slice(8, 10)) : daysIn;
    const uncat = r2((d.expense || []).concat(d.income || []).filter(x => x.category_id === 'Cat_Uncategorized').reduce((t, x) => t + Math.abs(Number(x.amount || 0)), 0));
    const negAccs = cash.filter(a => a.balance < -0.004);
    const pending = S.inbox.length;
    $('#navN').textContent = pending ? `(${pending})` : '';

    // statement เดือนก่อน: บัญชีธนาคารที่มี statement ครอบคลุมเดือนนั้นแล้ว
    const pm = shiftMonth(today.slice(0, 7), -1);
    const pmEnd = new Date(Date.UTC(+pm.slice(0, 4), +pm.slice(5, 7), 0)).toISOString().slice(0, 10);
    const banks = cash.filter(a => (a.account_type || 'BANK') === 'BANK');
    const pmLate = new Date(Date.parse(pmEnd) - 3 * 864e5).toISOString().slice(0, 10);   // เผื่อ statement ตัดก่อนสิ้นเดือน 3 วัน
    const covered = new Set(S.statements.filter(s => s.period_from <= `${pm}-04` && s.period_to >= pmLate).map(s => s.account_id));
    const stDone = banks.filter(a => covered.has(a.account_id)).length;

    const tasks = [
      { show: pending > 0, href: 'index.html', ic: 'inbox', bg: '#fff4e6', col: '#d9480f', big: `${pending}`, label: 'รายการรอเคลียร์' },
      { show: uncat > 0, href: 'index.html', ic: 'tag', bg: '#fff9db', col: '#b35c00', big: fmt(uncat), label: `ยังไม่ระบุหมวด (${monthLabel(S.month)})` },
      { show: negAccs.length > 0, href: '#accounts', ic: 'alert', bg: '#fff5f5', col: '#c92a2a', big: `${negAccs.length} บัญชี`, label: `เงินฝากติดลบ · ${negAccs.slice(0, 2).map(a => a.name).join(', ')}` },
      { show: banks.length > 0 && stDone < banks.length, href: 'index.html#stmt', ic: 'file', bg: '#e7f5ff', col: '#1864ab', big: `${stDone}/${banks.length}`, label: `Statement ${monthLabel(pm)} ที่นำเข้าแล้ว` },
    ].filter(t => t.show);

    // เงินไปไหน: หมวดรายจ่ายมากสุด 5 อันดับ
    const byCat = new Map();
    for (const x of d.expense || []) {
      const k = x.category_id || '-';
      const o = byCat.get(k) || { name: x.category_id === 'Cat_Uncategorized' ? 'ยังไม่ระบุหมวด' : displayName(x.category_name || k), sum: 0, n: 0 };
      o.sum += Math.abs(Number(x.amount || 0)); o.n++; byCat.set(k, o);
    }
    const cats = [...byCat.values()].sort((a, b) => b.sum - a.sum);
    const topCats = cats.slice(0, 5), maxCat = topCats[0]?.sum || 1;
    const colors = ['#7950f2', '#ff8787', '#ffa94d', '#4dabf7', '#63e6be'];

    // สรุปทุกบริษัท
    const ents = new Map();
    const ent = (id, name) => { const k = id || '—'; if (!ents.has(k)) ents.set(k, { name: displayName(name) || (id ? id : 'ไม่ระบุบริษัท'), bal: 0, card: 0, inc: 0, exp: 0, wht: 0 }); return ents.get(k); };
    for (const e of d.entities || []) ent(e.entity_id, e.name);
    for (const a of cash) ent(a.entity_id, a.entity_name).bal += a.balance;
    for (const a of credit) ent(a.entity_id, a.entity_name).card += a.balance;
    for (const x of d.income || []) ent(x.entity_id, x.entity_name).inc += Number(x.amount || 0);
    for (const x of d.expense || []) ent(x.entity_id, x.entity_name).exp += Number(x.amount || 0);
    for (const w of d.wht?.received || []) if (w.mo === S.month) ent(w.entity_id, w.company).wht += Number(w.wht || 0);
    const entRows = [...ents.values()].filter(e => e.bal || e.card || e.inc || e.exp || e.wht).sort((a, b) => b.bal - a.bal);
    const tot = k => r2(entRows.reduce((t, e) => t + e[k], 0));

    const shownAccs = S.showAll ? [...cash].sort((a, b) => b.balance - a.balance) : [...negAccs, ...cash.filter(a => a.balance >= 0).sort((a, b) => b.balance - a.balance)].slice(0, 6);

    $('#view').innerHTML = `
      <section class="todo" aria-label="งานที่ต้องทำ">
        <h2>เคลียร์ก่อน แล้วตัวเลขจะถูกต้อง <small>${tasks.length ? `${tasks.length} เรื่อง` : ''}</small></h2>
        ${tasks.length ? `<div class="tasks">${tasks.map(t => `<a class="task" href="${t.href}">
            <span class="ic" style="background:${t.bg};color:${t.col}">${icon(t.ic)}</span>
            <div style="min-width:0"><b style="color:${t.col}">${esc(t.big)}</b><span>${esc(t.label)}</span></div></a>`).join('')}</div>`
          : `<div class="alldone">${icon('check')} เรียบร้อยทุกอย่าง ไม่มีงานค้าง</div>`}
      </section>

      <div class="grid g2">
        <section class="card">
          <h2>เงินที่มีทั้งหมด ${icon('bank', '#5f3dc4')}</h2>
          <div class="big">${fmt(cashSum)}</div>
          <div class="kv"><span>${icon('bank', '#087f5b')} เงินฝาก / เงินสด <small>${cash.length} บัญชี</small></span><b>${num(cashSum)}</b></div>
          <div class="kv"><span>${icon('card', '#c92a2a')} บัตรเครดิตค้างจ่าย <small>${credit.length} ใบ</small></span><b>${num(-creditOwed)}</b></div>
          <div class="kv"><span>${icon('trend', '#1c4fd6')} ลงทุนสุทธิ ${monthLabel(S.month)}</span><b>${num(invNet)}</b></div>
        </section>

        <section class="card">
          <h2>${isNow ? 'เดือนนี้' : 'เดือน'} (${monthLabel(S.month)}) <small class="mut">${isNow ? `ผ่านไป ${days}/${daysIn} วัน` : ''}</small></h2>
          <div class="tiles3">
            <div class="tile" style="background:#e6fcf5"><div class="pos">รับ</div><div class="pos">${fmt(inc)}</div></div>
            <div class="tile" style="background:#fff5f5"><div class="neg">จ่าย</div><div class="neg">${fmt(exp)}</div></div>
            <div class="tile"><div class="mut">เฉลี่ย/วัน</div><div>${fmt(Math.abs(exp) / Math.max(days, 1))}</div></div>
          </div>
          ${topCats.length ? topCats.map((c, i) => `<div class="barrow"><div class="t"><span>${esc(c.name)} <small class="mut">· ${c.n}</small></span><b class="neg">(${money(c.sum)})</b></div>
            <div class="track"><i style="width:${Math.max(3, c.sum / maxCat * 100)}%;background:${c.name === 'ยังไม่ระบุหมวด' ? '#ffc078' : colors[i % colors.length]}"></i></div></div>`).join('')
            : '<div class="empty" style="padding:20px">ยังไม่มีรายจ่ายเดือนนี้</div>'}
        </section>
      </div>

      <div class="grid g2">
        <section class="card">
          <h2>สินทรัพย์</h2>
          <div class="kv"><span>${icon('bank', '#087f5b')} เงินฝาก / เงินสด</span><b>${num(cashSum)}</b></div>
          <div class="kv"><span>${icon('user', '#5f3dc4')} ลูกหนี้ / เงินให้ยืม <small><a href="index.html#debt">${arN} ราย ›</a></small></span><b>${num(arSum)}</b></div>
          ${creditOver ? `<div class="kv"><span>${icon('card', '#087f5b')} บัตรเครดิตจ่ายเกิน</span><b>${num(creditOver)}</b></div>` : ''}
          <div class="kv total"><span>รวมสินทรัพย์</span><span class="pos">${fmt(assets)}</span></div>
        </section>
        <section class="card">
          <h2>หนี้สิน</h2>
          <div class="kv"><span>${icon('card', '#c92a2a')} บัตรเครดิต <small>${credit.length} ใบ</small></span><b>${fmt(creditOwed)}</b></div>
          <div class="kv"><span>${icon('build', '#9c36b5')} เจ้าหนี้ / เงินกู้ <small><a href="index.html#debt">${apN} ราย ›</a></small></span><b>${fmt(apSum)}</b></div>
          <div class="kv total"><span>รวมหนี้สิน</span><span class="neg">${fmt(debts)}</span></div>
        </section>
        <section class="card net">
          <h2>ความมั่งคั่งสุทธิ</h2>
          <div class="big">${r2(net) < 0 ? `(${money(-net)})` : money(net)}</div>
          <div style="color:#e5dbff;font-size:14px;margin-top:6px">หนี้สินเท่ากับ ${assets > 0 ? Math.round(debts / assets * 100) : 0}% ของสินทรัพย์</div>
          <div class="meter"><i style="width:${assets > 0 ? Math.min(100, debts / assets * 100) : 0}%"></i></div>
        </section>
      </div>

      <section class="card" style="margin-top:16px">
        <h2>สรุปทุกบริษัท (${monthLabel(S.month)}) ${icon('build', '#5f3dc4')}</h2>
        ${entRows.length ? `<div class="scroll"><table>
          <thead><tr><th>บริษัท</th><th>เงินฝาก/เงินสด</th><th>บัตรเครดิต</th><th>รับ</th><th>จ่าย</th><th>ถูกหัก ณ ที่จ่าย</th></tr></thead>
          <tbody>${entRows.map(e => `<tr><td>${esc(e.name)}</td><td>${num(e.bal)}</td><td>${num(e.card)}</td><td>${num(e.inc, { pos: true })}</td><td>${num(e.exp)}</td><td>${fmt(e.wht)}</td></tr>`).join('')}</tbody>
          <tfoot><tr><td>รวม</td><td>${num(tot('bal'))}</td><td>${num(tot('card'))}</td><td>${num(tot('inc'), { pos: true })}</td><td>${num(tot('exp'))}</td><td>${fmt(tot('wht'))}</td></tr></tfoot>
        </table></div>` : '<div class="empty">ยังไม่มีข้อมูลบริษัท</div>'}
      </section>

      <section class="card" id="accounts" style="margin-top:16px">
        <h2>บัญชี ${S.showAll ? `ทั้งหมด ${cash.length}` : 'หลัก'} <button class="more" id="toggleAccs">${S.showAll ? 'ย่อ' : `ดูทั้ง ${cash.length} บัญชี`}</button></h2>
        <div class="accs">${shownAccs.map(a => `<div class="acc ${a.balance < -0.004 ? 'bad' : ''}"><div><div class="n">${esc(a.name)}</div><small>${esc(displayName(a.entity_name) || '')}${a.last_date ? ' · ล่าสุด ' + esc(a.last_date) : ''}</small></div><b>${num(a.balance)}</b></div>`).join('')}</div>
        ${credit.length ? `<h2 style="margin-top:18px">บัตรเครดิต ${credit.length} ใบ</h2>
        <div class="accs">${[...credit].sort((a, b) => a.balance - b.balance).map(a => `<div class="acc"><div><div class="n">${esc(a.name)}</div><small>${a.credit_limit ? 'วงเงิน ' + fmt(a.credit_limit) : 'ยังไม่ตั้งวงเงิน'}${a.due_day ? ' · ครบกำหนดวันที่ ' + a.due_day : ''}</small></div><b>${num(a.balance)}</b></div>`).join('')}</div>` : ''}
      </section>`;
    $('#toggleAccs').onclick = () => { S.showAll = !S.showAll; render(); };
  }

  $('#prevM').onclick = () => { S.month = shiftMonth(S.month, -1); load(); };
  $('#nextM').onclick = () => { if (S.month < today.slice(0, 7)) { S.month = shiftMonth(S.month, 1); load(); } };
  load();
})();
</script>
</body>
</html>
