<script>
/* ⏱️ ทุกคำขอมีเวลารอสูงสุด (2026-10-11) — เดิมถ้าเซิร์ฟเวอร์ค้าง หน้าจอหมุนไม่รู้จบ
   อ่านเอกสาร/statement ด้วย AI ใช้เวลานาน ให้รอได้ 3 นาที · อย่างอื่น 40 วินาที
   และแปลง error ให้อ่านรู้เรื่อง แทน "Failed to fetch" */
(function () {
  const orig = window.fetch.bind(window);
  window.fetch = (input, init = {}) => {
    if (init.signal || typeof AbortController === 'undefined') return orig(input, init);
    const url = typeof input === 'string' ? input : (input?.url || '');
    const ms = /\/(upload|statement|import|retry|backup|restore|ocr)/i.test(url) ? 180000 : 40000;
    const ac = new AbortController();
    const timer = setTimeout(() => ac.abort(), ms);
    return orig(input, { ...init, signal: ac.signal })
      .catch(err => {
        if (err?.name === 'AbortError') throw new Error('เซิร์ฟเวอร์ตอบช้าเกินไป — ลองใหม่อีกครั้ง');
        if (err instanceof TypeError) throw new Error('เชื่อมต่อไม่ได้ — ตรวจอินเทอร์เน็ตแล้วลองใหม่');
        throw err;
      })
      .finally(() => clearTimeout(timer));
  };
})();
</script>

    const PROD = 'https://record-revenue.9nimz.workers.dev';
    try {
      const q = new URLSearchParams(location.search).get('api');
      if (q) sessionStorage.setItem('api_base_override', q);
      const o = sessionStorage.getItem('api_base_override');
      if (o) return o.replace(/\/$/, '');
      if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') return 'http://localhost:8787';
    } catch (e) { /* ใช้ของจริง */ }
    return PROD;
  })();
  const token = () => { try { return localStorage.getItem('session_token') || sessionStorage.getItem('session_token') || ''; } catch { return ''; } };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
  const money = n => Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmt = n => r2(n) < 0 ? `(${money(-r2(n))})` : money(n);
  const $ = s => document.querySelector(s);
  const view = $('#view');
  const plain = n => String(n || '').replace(/^\s*\[[^\]]+\]\s*/, '').trim() || String(n || '');
  /* "1,234.50" · "(1,234.50)" → ตัวเลข · ว่าง = 0 · อ่านไม่ออก = NaN */
  const num = s => { let t = String(s ?? '').trim().replace(/[,\s฿]/g, ''); if (!t) return 0; let neg = false; if (/^\(.*\)$/.test(t)) { neg = true; t = t.slice(1, -1); } const v = Number(t); return isNaN(v) ? NaN : (neg ? -v : v); };
  const TH_M = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
  const thd = s => { if (!s) return '-'; const [y, m, d] = s.slice(0, 10).split('-').map(Number); return `${d} ${TH_M[m - 1]} ${String(y + 543).slice(2)}`; };
  const TYPE_TH = { BANK: 'ธนาคาร', CASH: 'เงินสด', CREDIT: 'บัตรเครดิต', EWALLET: 'e-wallet', TRIP_HOLDING: 'ทริป' };
  const S = { data: null, meta: null, loans: [], edit: null };
  function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 3200); }
  async function api(path, body) {
    const res = await fetch(API + path, { method: body ? 'POST' : 'GET', headers: { Authorization: `Bearer ${token()}`, ...(body ? { 'Content-Type': 'application/json' } : {}) }, body: body ? JSON.stringify(body) : undefined });
    if (res.status === 401) throw Object.assign(new Error('กรุณาเข้าสู่ระบบ'), { login: true });
    const d = await res.json().catch(() => ({}));
    if (!res.ok || d.error) throw new Error(d.error || `ผิดพลาด (${res.status})`);
    return d;
  }
  function sheet(title, html, footer) {
    const bg = document.createElement('div'); bg.className = 'sheet-bg';
    bg.innerHTML = `<div class="sheet" role="dialog" aria-label="${esc(title)}"><header><h2>${esc(title)}</h2><button class="x" data-close aria-label="ปิด">✕</button></header><div class="body">${html}<div class="err" data-err></div></div>${footer ? `<footer>${footer}</footer>` : ''}</div>`;
    const close = () => bg.remove();
    bg.addEventListener('click', e => { if (e.target === bg || e.target.closest('[data-close]')) close(); });
    document.body.appendChild(bg);
    const el = bg.querySelector('.sheet');
    return { el, close, err: t => { el.querySelector('[data-err]').textContent = t; } };
  }

  async function load() {
    if (!token()) { view.innerHTML = `<div class="empty" style="background:#fff;border-radius:18px"><h3>ยังไม่ได้เข้าสู่ระบบ</h3><a href="../index.html">ไปหน้าเข้าสู่ระบบ</a></div>`; return; }
    try {
      const [d, m, l] = await Promise.all([api('/api/inbox/opening'), S.meta ? Promise.resolve(S.meta) : api('/api/inbox/meta'), api('/api/inbox/loans').catch(() => ({ loans: [] }))]);
      S.data = d; S.meta = m; S.loans = (l.loans || []).filter(x => x.status !== 'deleted');
      render();
    } catch (e) { view.innerHTML = `<div class="empty" style="background:#fff;border-radius:18px">โหลดไม่สำเร็จ: ${esc(e.message)}</div>`; }
  }
  const render = () => S.edit ? renderEditor() : renderList();
  const entName = id => plain((S.meta.entities || []).find(e => e.entity_id === id)?.name || '');
  const accOf = id => (S.meta.accounts || []).find(a => a.account_id === id);
  const catOf = id => (S.meta.categories || []).find(c => c.category_id === id);

  // ───────── รายการชุด ─────────
  function renderList() {
    const D = S.data, sb = D.suspense?.balance || 0;
    view.innerHTML = `
      <div class="setc ${Math.abs(sb) >= 0.005 ? 'bad' : ''}"><h3><span>⚖️ ${esc(D.suspense?.name || 'บัญชีพักยอดยกมา')} (ทุกชุด)</span>
        <span class="tag ${Math.abs(sb) < 0.005 ? 'ok' : 'bad'}">${Math.abs(sb) < 0.005 ? '✅ 0.00' : '⚠️ ' + fmt(sb)}</span></h3>
        <div class="sub">ต้องเป็น 0.00 = ทุกชุดลงเดบิต/เครดิตครบและถูกฝั่ง · ระบบใช้หมวดนี้ปิดยอดให้อัตโนมัติ</div></div>
      <div class="tools"><button class="b main" id="add">＋ ชุดยอดยกมาใหม่</button></div>
      ${D.sets.length ? D.sets.map(s => {
        const n = k => s.lines.filter(l => l.kind === k).length;
        return `<div class="setc ${s.balanced && !s.pre_start.length ? '' : 'bad'}">
          <h3><span>${esc(s.name)}</span><span class="tag ${s.balanced ? 'ok' : 'bad'}">${s.balanced ? '✅ สมดุล' : '⚠️ ยังไม่สมดุล'}</span></h3>
          <div class="sub">เริ่ม ${thd(s.date)}${s.entity_id ? ' · ' + esc(entName(s.entity_id)) : ''} · บัญชี ${n('ACC')} · หมวด ${n('CAT')} · เงินกู้ ${n('LOAN')}</div>
          <div class="drcr"><div><small>เดบิต</small><b>${money(s.debit)}</b></div><div><small>เครดิต</small><b>${money(s.credit)}</b></div>
            <div><small>บัญชีพัก (ต่าง)</small><b class="${s.balanced ? 'pos' : 'neg'}">${fmt(s.suspense)}</b></div></div>
          ${s.pre_start.length ? `<div class="warn">⚠️ มีรายการก่อนวันเริ่ม: ${s.pre_start.map(p => `${esc(p.account_name)} ${p.n} รายการ (ตั้งแต่ ${thd(p.first_date)})`).join(' · ')} — ยอดจะนับซ้ำ ให้ลบรายการเก่า หรือเลื่อนวันเริ่มให้ก่อนรายการแรก</div>` : ''}
          <div class="btns">${s.can_edit ? `<button class="b" data-ed="${esc(s.set_id)}">✏️ แก้ไข</button><button class="b danger" data-del="${esc(s.set_id)}">🗑️ ลบ</button>` : `<button class="b" data-ed="${esc(s.set_id)}">👁️ ดู</button><span class="mut" style="font-size:13px;align-self:center">แก้ได้เฉพาะคนที่มีสิทธิ์ทุกบัญชีในชุด</span>`}</div>
        </div>`;
      }).join('') : `<div class="setc"><div class="empty" style="padding:18px">ยังไม่มีชุดยอดยกมา<br><small>แต่ละคนสร้างชุดของตัวเองได้ และเริ่มคนละวันได้</small></div></div>`}
      <div class="note">• 1 บัญชี / 1 สัญญาเงินกู้ อยู่ได้ชุดเดียว · ยอดยกมาสร้างเป็นรายการจริง ณ วันเริ่ม — ยอดบัญชี ลูกหนี้ รายงาน เห็นทันที<br>
        • ค่าใช้จ่าย/รายได้สะสมต้นปี นับในรายงานรับ-จ่าย ณ วันเริ่ม · บัญชีพักไม่นับเป็นรายรับ/รายจ่าย<br>
        • ปิดเดือนได้เมื่อชุดสมดุล และไม่มีรายการก่อนวันเริ่ม</div>`;
    $('#add').onclick = () => openEditor(null);
    view.querySelectorAll('[data-ed]').forEach(b => b.onclick = () => openEditor(D.sets.find(s => s.set_id === b.dataset.ed)));
    view.querySelectorAll('[data-del]').forEach(b => b.onclick = () => delSet(D.sets.find(s => s.set_id === b.dataset.del)));
  }
  async function delSet(s) {
    if (!confirm(`ลบชุด "${s.name}"?\nรายการยอดยกมาของชุดนี้จะถูกลบ ยอดบัญชีจะกลับไปเหมือนก่อนใส่ยอดยกมา\n(ยอดเริ่มต้นของสัญญาเงินกู้ไม่เปลี่ยน)`)) return;
    try { await api(`/api/inbox/opening/${encodeURIComponent(s.set_id)}/delete`, {}); toast('🗑️ ลบชุดแล้ว'); await load(); } catch (e) { toast('⚠️ ' + e.message); }
  }

  // ───────── แก้ไขชุด ─────────
  const blankCat = () => ({ category_id: '', contact_id: '', side: 'DR', amount: '', note: '' });
  function openEditor(s) {
    const ents = S.meta.entities || [];
    const y = new Date(Date.now() + 7 * 3600e3).getUTCFullYear();
    const E = { set_id: s?.set_id || null, name: s?.name || '', date: s?.date || `${y}-01-01`, entity_id: s ? (s.entity_id || '') : (ents[0]?.entity_id || ''),
      anchor_account_id: s?.anchor_account_id || '', acc: {}, loans: {}, cats: [], showAll: false, readOnly: !!s && !s.can_edit, dirty: false };
    for (const l of s?.lines || []) {
      if (l.kind === 'ACC') E.acc[l.account_id] = { amount: money(l.amount), side: l.side };
      else if (l.kind === 'LOAN') E.loans[l.debt_id] = money(l.amount);
      else E.cats.push({ category_id: l.category_id, contact_id: l.contact_id || '', side: l.side, amount: money(l.amount), note: l.note || '' });
    }
    if (!E.cats.length) E.cats.push(blankCat());
    if (Object.keys(E.acc).some(id => accOf(id)?.entity_id !== E.entity_id)) E.showAll = true;   // บัญชีของเจ้าของอื่นในชุดนี้ → แสดงทุกบัญชี
    S.edit = E; render(); window.scrollTo(0, 0);
  }
  const usedElsewhere = (kind, id) => (S.data.used[kind] || []).some(u => (u.account_id || u.debt_id) === id && u.set_id !== S.edit.set_id);
  const defaultSide = c => !c ? 'DR' : (c.behavior === 'ASSET' || c.behavior === 'EXPENSE') ? 'DR' : 'CR';
  const sideSel = (v, attrs, dis) => `<select class="inp side" ${attrs} ${dis} aria-label="ฝั่ง"><option value="DR" ${v !== 'CR' ? 'selected' : ''}>เดบิต</option><option value="CR" ${v === 'CR' ? 'selected' : ''}>เครดิต</option></select>`;
  function catOptions(sel) {
    const cats = (S.meta.categories || []).filter(c => !String(c.category_id).startsWith('CAT-OB-'));
    const groups = new Map();
    for (const c of cats) { const g = plain(c.group) || 'อื่น ๆ'; if (!groups.has(g)) groups.set(g, []); groups.get(g).push(c); }
    return `<option value="">— เลือกหมวด —</option>` + [...groups.entries()].map(([g, cs]) => `<optgroup label="${esc(g)}">${cs.map(c => `<option value="${esc(c.category_id)}" ${c.category_id === sel ? 'selected' : ''}>${esc(plain(c.name))}</option>`).join('')}</optgroup>`).join('');
  }
  const conOptions = sel => `<option value="">— ไม่ระบุคู่ค้า —</option>` + (S.meta.contacts || []).map(c => `<option value="${esc(c.contact_id)}" ${c.contact_id === sel ? 'selected' : ''}>${esc(plain(c.name))}</option>`).join('');
  function buildLines() {
    const E = S.edit, out = [];
    for (const [id, v] of Object.entries(E.acc)) { const a = num(v.amount); if (a) out.push({ kind: 'ACC', account_id: id, side: v.side, amount: a }); }
    for (const c of E.cats) { const a = num(c.amount); if (a || c.category_id) out.push({ kind: 'CAT', category_id: c.category_id, contact_id: c.contact_id || null, side: c.side, amount: a, note: c.note }); }
    for (const [id, v] of Object.entries(E.loans)) { const a = num(v); if (a) { const d = S.loans.find(x => x.debt_id === id); out.push({ kind: 'LOAN', debt_id: id, side: d?.type === 'RECEIVABLE' ? 'DR' : 'CR', amount: a }); } }
    return out;
  }
  function sums() {
    const ls = buildLines().filter(l => !isNaN(l.amount));
    const dr = r2(ls.filter(l => l.side !== 'CR').reduce((t, l) => t + l.amount, 0)), cr = r2(ls.filter(l => l.side === 'CR').reduce((t, l) => t + l.amount, 0));
    return { dr, cr, diff: r2(dr - cr) };
  }
  function updBar() {
    const t = sums(), ok = Math.abs(t.diff) < 0.005, el = $('#sum');
    if (el) el.innerHTML = `<span>เดบิต <b>${money(t.dr)}</b></span><span>เครดิต <b>${money(t.cr)}</b></span><span class="${ok ? 'okb' : 'badb'}">บัญชีพัก <b>${fmt(t.diff)}</b> ${ok ? '✅ สมดุล' : '⚠️'}</span>`;
  }
  function renderEditor() {
    const E = S.edit, dis = E.readOnly ? 'disabled' : '';
    const ents = S.meta.entities || [], allAcc = (S.meta.accounts || []).filter(a => a.account_type !== 'TRIP_HOLDING');
    const accs = allAcc.filter(a => !usedElsewhere('accounts', a.account_id) && (E.showAll || !E.entity_id || a.entity_id === E.entity_id || E.acc[a.account_id]));
    const loans = S.loans.filter(l => !usedElsewhere('debts', l.debt_id));
    const hiddenUsed = allAcc.filter(a => usedElsewhere('accounts', a.account_id)).length;
    view.innerHTML = `
      <div class="tools" style="margin-top:0"><button class="back" id="bk" style="background:var(--brand)">‹ กลับ</button>${E.readOnly ? '<span class="tag mut" style="align-self:center">ดูอย่างเดียว</span>' : ''}</div>
      <div class="ed"><h2>ข้อมูลชุด</h2>
        <div class="g4">
          <div><label class="f" for="eN">ชื่อชุด</label><input class="inp" id="eN" maxlength="80" value="${esc(E.name)}" placeholder="เช่น ยอดยกมา North" ${dis}></div>
          <div><label class="f" for="eD">วันที่เริ่ม (ยอด ณ ต้นวันนี้)</label><input class="inp" id="eD" type="date" value="${esc(E.date)}" ${dis}></div>
          <div><label class="f" for="eE">เจ้าของ</label><select class="inp" id="eE" ${dis}><option value="">— ไม่ระบุ —</option>${ents.map(e => `<option value="${esc(e.entity_id)}" ${e.entity_id === E.entity_id ? 'selected' : ''}>${esc(plain(e.name))}</option>`).join('')}</select></div>
          <div><label class="f" for="eA">บัญชีที่ใช้บันทึก (หมวด/เงินกู้)</label><select class="inp" id="eA" ${dis}><option value="">— อัตโนมัติ —</option>${allAcc.map(a => `<option value="${esc(a.account_id)}" ${a.account_id === E.anchor_account_id ? 'selected' : ''}>${esc(plain(a.name))}</option>`).join('')}</select></div>
        </div>
        <p class="hint" style="margin-top:8px">ยอดของหมวด/เงินกู้ บันทึกเป็นรายการยอดรวม 0 ในบัญชีที่เลือก — ยอดเงินในบัญชีนั้นไม่เปลี่ยน</p>
      </div>
      <div class="ed"><h2><span>🏦 1. บัญชีธนาคาร · เงินสด · บัตรเครดิต</span>
        <label style="font-size:13px;font-weight:500;display:flex;gap:6px;align-items:center"><input type="checkbox" id="eAll" ${E.showAll ? 'checked' : ''} ${dis}> แสดงทุกบัญชี</label></h2>
        <p class="hint">ใส่ยอดคงเหลือ ณ วันเริ่ม · มีเงิน = เดบิต · บัตรเครดิตค้างจ่าย = เครดิต · เว้นว่าง = ไม่ใส่${hiddenUsed ? ` · ซ่อน ${hiddenUsed} บัญชีที่อยู่ในชุดอื่นแล้ว` : ''}</p>
        ${accs.length ? accs.map(a => { const v = E.acc[a.account_id] || { amount: '', side: a.account_type === 'CREDIT' ? 'CR' : 'DR' };
          return `<div class="ln"><span class="nm"><b>${esc(plain(a.name))}</b><small>${esc(TYPE_TH[a.account_type] || a.account_type || '')}${a.entity_id ? ' · ' + esc(entName(a.entity_id)) : ''}</small></span>
            ${sideSel(v.side, `data-as="${esc(a.account_id)}"`, dis)}<input class="inp amt" inputmode="decimal" placeholder="0.00" data-aa="${esc(a.account_id)}" value="${esc(v.amount)}" aria-label="ยอด ${esc(plain(a.name))}" ${dis}></div>`; }).join('')
          : '<div class="empty" style="padding:12px">ไม่มีบัญชีของเจ้าของนี้ — ติ๊ก "แสดงทุกบัญชี"</div>'}
      </div>
      <div class="ed"><h2><span>🗂️ 2. ลูกหนี้ · เจ้าหนี้ · สินทรัพย์ · ทุน · รายได้/ค่าใช้จ่ายสะสม</span>${E.readOnly ? '' : '<button class="b" id="paste" style="min-height:38px;padding:6px 12px;font-size:14px">📋 วางจาก Excel</button>'}</h2>
        <p class="hint">เลือกหมวด (ใส่คู่ค้าถ้าเป็นลูกหนี้/เจ้าหนี้รายคน) · ระบบเลือกฝั่งตามประเภทหมวดให้ เปลี่ยนได้${S.data.assets_opening_total ? ` · ทะเบียนทรัพย์สินยอดยกมารวม ${money(S.data.assets_opening_total)} — ใส่เป็นบรรทัดหมวดทรัพย์สินฝั่งเดบิต` : ''}</p>
        <div id="cats">${E.cats.map((c, i) => `<div class="lc">
          <select class="inp" data-cc="${i}" aria-label="หมวด" ${dis}>${catOptions(c.category_id)}</select>
          <select class="inp" data-ct="${i}" aria-label="คู่ค้า" ${dis}>${conOptions(c.contact_id)}</select>
          ${sideSel(c.side, `data-cs="${i}"`, dis)}
          <input class="inp amt" inputmode="decimal" placeholder="0.00" data-ca="${i}" value="${esc(c.amount)}" aria-label="จำนวนเงิน" ${dis}>
          ${E.readOnly ? '<span></span>' : `<button class="x" data-cx="${i}" aria-label="ลบบรรทัด">✕</button>`}
          <input class="inp nt" data-cn="${i}" maxlength="200" placeholder="หมายเหตุ (ไม่บังคับ)" value="${esc(c.note)}" aria-label="หมายเหตุ" ${dis}></div>`).join('')}</div>
        ${E.readOnly ? '' : '<div class="tools"><button class="b" id="addc">＋ เพิ่มบรรทัด</button></div>'}
      </div>
      <div class="ed"><h2>🏠 3. เงินกู้ / ผ่อน</h2>
        <p class="hint">ยอดคงเหลือ ณ วันเริ่ม — บันทึกแล้วตั้ง "ยอดเริ่มต้น" และ "วันเริ่ม" ของสัญญาในหน้าบัตร & เงินกู้ให้ตรงกัน · เพิ่มสัญญาใหม่ที่ <a href="cards.html">บัตร & เงินกู้</a></p>
        ${loans.length ? loans.map(l => `<div class="ln"><span class="nm"><b>${esc(l.name)}</b><small>${l.type === 'RECEIVABLE' ? 'ให้กู้ (ลูกหนี้)' : 'กู้มา (หนี้สิน)'} · ${esc(plain(l.contact_name))} · ยอดเริ่มต้นตอนนี้ ${money(l.start_balance)}</small></span>
          <span class="side mut" style="text-align:center">${l.type === 'RECEIVABLE' ? 'เดบิต' : 'เครดิต'}</span>
          <input class="inp amt" inputmode="decimal" placeholder="0.00" data-la="${esc(l.debt_id)}" value="${esc(E.loans[l.debt_id] || '')}" aria-label="ยอด ${esc(l.name)}" ${dis}></div>`).join('') : '<div class="empty" style="padding:12px">ไม่มีสัญญาเงินกู้</div>'}
      </div>
      <div class="err" id="eErr"></div>
      <div class="obar"><div class="sum" id="sum"></div>${E.readOnly ? '' : '<button class="b main" id="save">💾 บันทึก</button>'}</div>`;
    updBar();
    $('#bk').onclick = () => { if (!E.readOnly && E.dirty && !confirm('ยังไม่ได้บันทึก — ออกโดยไม่บันทึก?')) return; S.edit = null; render(); };
    if (E.readOnly) return;
    const dirty = () => { E.dirty = true; updBar(); };
    $('#eN').oninput = e => { E.name = e.target.value; E.dirty = true; };
    $('#eD').onchange = e => { E.date = e.target.value; E.dirty = true; };
    $('#eE').onchange = e => { E.entity_id = e.target.value; E.dirty = true; renderEditor(); };
    $('#eA').onchange = e => { E.anchor_account_id = e.target.value; E.dirty = true; };
    $('#eAll').onchange = e => { E.showAll = e.target.checked; renderEditor(); };
    view.querySelectorAll('[data-aa]').forEach(i => i.oninput = () => { const id = i.dataset.aa; E.acc[id] = { side: E.acc[id]?.side || view.querySelector(`[data-as="${CSS.escape(id)}"]`).value, amount: i.value }; dirty(); });
    view.querySelectorAll('[data-as]').forEach(s => s.onchange = () => { const id = s.dataset.as; E.acc[id] = { amount: E.acc[id]?.amount || '', side: s.value }; dirty(); });
    view.querySelectorAll('[data-la]').forEach(i => i.oninput = () => { E.loans[i.dataset.la] = i.value; dirty(); });
    view.querySelectorAll('[data-cc]').forEach(s => s.onchange = () => { const k = s.dataset.cc, c = E.cats[+k]; c.category_id = s.value; c.side = defaultSide(catOf(s.value)); view.querySelector(`[data-cs="${k}"]`).value = c.side; dirty(); });
    view.querySelectorAll('[data-ct]').forEach(s => s.onchange = () => { E.cats[+s.dataset.ct].contact_id = s.value; dirty(); });
    view.querySelectorAll('[data-cs]').forEach(s => s.onchange = () => { E.cats[+s.dataset.cs].side = s.value; dirty(); });
    view.querySelectorAll('[data-ca]').forEach(i => i.oninput = () => { E.cats[+i.dataset.ca].amount = i.value; dirty(); });
    view.querySelectorAll('[data-cn]').forEach(i => i.oninput = () => { E.cats[+i.dataset.cn].note = i.value; E.dirty = true; });
    view.querySelectorAll('[data-cx]').forEach(b => b.onclick = () => { E.cats.splice(+b.dataset.cx, 1); if (!E.cats.length) E.cats.push(blankCat()); E.dirty = true; renderEditor(); });
    $('#addc').onclick = () => { E.cats.push(blankCat()); renderEditor(); const all = view.querySelectorAll('[data-cc]'); all[all.length - 1]?.focus(); };
    $('#paste').onclick = pasteForm;
    $('#save').onclick = save;
  }
  async function save() {
    const E = S.edit, err = t => { $('#eErr').textContent = t; if (t) toast('⚠️ ' + t); };
    if (!E.name.trim()) return err('ตั้งชื่อชุดก่อน');
    if (!E.date) return err('เลือกวันที่เริ่ม');
    const lines = buildLines();
    if (lines.some(l => isNaN(l.amount) || l.amount < 0)) return err('จำนวนเงินต้องเป็นตัวเลขบวก แล้วเลือกฝั่ง เดบิต/เครดิต');
    if (lines.some(l => l.kind === 'CAT' && l.amount && !l.category_id)) return err('มีบรรทัดที่ใส่จำนวนเงินแต่ยังไม่เลือกหมวด');
    const send = lines.filter(l => l.amount);
    if (!send.length) return err('ยังไม่มีบรรทัดที่มีจำนวนเงิน');
    const t = sums();
    if (Math.abs(t.diff) >= 0.005 && !confirm(`เดบิต ${money(t.dr)} ≠ เครดิต ${money(t.cr)}\nบัญชีพักค้าง ${fmt(t.diff)} — ปิดเดือนจะไม่ผ่านจนกว่าจะสมดุล\n\nบันทึกไว้ก่อนไหม?`)) return;
    const b = $('#save'); b.disabled = true; err('');
    try {
      const r = await api('/api/inbox/opening', { set_id: E.set_id, name: E.name.trim(), date: E.date, entity_id: E.entity_id || null, anchor_account_id: E.anchor_account_id || null, lines: send });
      toast(r.balanced ? '✅ บันทึกแล้ว · สมดุล' : `💾 บันทึกแล้ว · บัญชีพักค้าง ${fmt(r.suspense)}`);
      S.edit = null; await load();
    } catch (e) { err(e.message); b.disabled = false; }
  }
  /* วางจาก Excel: ชื่อบัญชีหรือหมวด | คู่ค้า | เดบิต | เครดิต | หมายเหตุ (คั่นด้วย Tab) */
  function pasteForm() {
    const sh = sheet('วางยอดยกมาจาก Excel', `
      <p class="mut" style="font-size:14px;margin-top:4px">คัดลอกจาก Excel 5 คอลัมน์ตามลำดับ: <b>ชื่อบัญชี/หมวด · คู่ค้า · เดบิต · เครดิต · หมายเหตุ</b><br>ชื่อตรงกับบัญชี → ใส่ในส่วนบัญชี · ตรงกับหมวด → เพิ่มเป็นบรรทัดหมวด · แถวหัวตาราง/ไม่มีตัวเลขจะข้าม</p>
      <textarea class="inp" id="pT" placeholder="KBank ออมทรัพย์&#9;&#9;125,000.00&#9;&#9;&#10;ลูกหนี้เงินยืม&#9;นายเอ&#9;5,000.00&#9;&#9;&#10;ทุน&#9;&#9;&#9;130,000.00&#9;" aria-label="ข้อมูลจาก Excel"></textarea>
      <div id="pR" class="mut" style="font-size:13px;margin-top:8px"></div>`, `<button class="b main" data-go>เพิ่มเข้าชุด</button>`);
    const norm = s => plain(s).toLowerCase().replace(/\s+/g, ' ').trim();
    sh.el.querySelector('[data-go]').onclick = () => {
      const E = S.edit, rows = sh.el.querySelector('#pT').value.split(/\r?\n/).filter(r => r.trim());
      const accs = S.meta.accounts || [], cats = (S.meta.categories || []).filter(c => !String(c.category_id).startsWith('CAT-OB-')), cons = S.meta.contacts || [];
      let nAcc = 0, nCat = 0; const miss = [];
      if (E.cats.length === 1 && !E.cats[0].category_id && !E.cats[0].amount) E.cats = [];
      for (const row of rows) {
        const c = row.split('\t');
        const key = norm(c[0]), dr = num(c[2]), cr = num(c[3]);
        if (!key || isNaN(dr) || isNaN(cr) || (!dr && !cr)) continue;
        const net = r2((dr || 0) - (cr || 0)), side = net >= 0 ? 'DR' : 'CR', amount = money(Math.abs(net));
        const a = accs.find(x => String(x.account_id).toLowerCase() === key || norm(x.name) === key);
        if (a) {
          if (usedElsewhere('accounts', a.account_id)) { miss.push(`${c[0].trim()} (อยู่ในชุดอื่นแล้ว)`); continue; }
          E.acc[a.account_id] = { amount, side }; nAcc++; if (a.entity_id !== E.entity_id) E.showAll = true; continue;
        }
        const k = cats.find(x => String(x.category_id).toLowerCase() === key || norm(x.name) === key);
        if (!k) { miss.push(c[0].trim()); continue; }
        const cn = norm(c[1] || ''), con = cn && cons.find(x => String(x.contact_id).toLowerCase() === cn || norm(x.name) === cn);
        if (cn && !con) miss.push(`${c[0].trim()} → ไม่พบคู่ค้า "${(c[1] || '').trim()}" (เพิ่มโดยไม่ระบุคู่ค้า)`);
        E.cats.push({ category_id: k.category_id, contact_id: con?.contact_id || '', side, amount, note: (c[4] || '').trim() }); nCat++;
      }
      if (!E.cats.length) E.cats.push(blankCat());
      E.dirty = true;
      renderEditor();
      if (miss.length) { sh.el.querySelector('#pR').innerHTML = `เพิ่มแล้ว บัญชี ${nAcc} · หมวด ${nCat}<br><b class="neg">ไม่พบ ${miss.length} แถว:</b> ${miss.map(esc).join(' · ')}<br>ปิดหน้าต่างนี้แล้วเพิ่มเองได้`; return; }
      sh.close(); toast(`📋 เพิ่มแล้ว · บัญชี ${nAcc} · หมวด ${nCat}`);
    };
    setTimeout(() => sh.el.querySelector('#pT').focus(), 50);
  }
  load();
})();
</script>
</body>
