<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ตั้งค่า · สมุดจด</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  ตั้งค่าใหม่ (2026-10-11) แทนหน้า "ตั้งค่าระบบ" เดิม — ใช้ API เดิมทั้งหมด:
    GET /api/settings · POST /api/settings/save · POST /api/settings/delete (admin) · GET/POST /api/users (บันทึก = admin)
  ชื่อข้อมูลหลักใช้รูปแบบเดิม "[ID] ชื่อ" — หน้านี้ให้พิมพ์แค่ชื่อ แล้วเติม [ID] ให้เอง (ถ้าชื่อเดิมมีแบบนั้น หรือเป็นรายการใหม่)
  2026-10-11 ย้ายมาแล้ว: ลบสมาชิก (ดูก่อนลบ) · สำรอง/กู้ข้อมูล · โปรเจกต์ — ยังอยู่หน้าเดิม: ธีม · ล้างข้อมูล
-->
<style>
  :root { --ink: #212529; --muted: #5c636a; --line: #ece8f8; --bg: #f8f7fd; --brand: #5f3dc4; --pos: #087f5b; --neg: #c92a2a; --bad: #e03131; --radius: 20px; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Anuphan', -apple-system, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
  body { padding-bottom: 40px; }
  button, select, input { font: inherit; color: inherit; }
  a { color: var(--brand); }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 0 16px; }
  .top { background: linear-gradient(135deg, #5f3dc4, #7950f2 60%, #9775fa); color: #fff; padding: 18px 0 60px; }
  .top .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .top h1 { margin: 0; font-size: 24px; } .top p { margin: 2px 0 0; font-size: 14px; color: #e5dbff; }
  .nav { display: flex; gap: 6px; flex-wrap: wrap; }
  .nav a { color: #fff; text-decoration: none; background: rgba(255,255,255,.18); padding: 10px 14px; border-radius: 12px; font-size: 14px; font-weight: 600; min-height: 44px; display: inline-flex; align-items: center; }
  .nav a.on { background: #fff; color: var(--brand); }
  .tabs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; background: #fff; border-radius: 16px; padding: 6px; margin-top: -40px; box-shadow: 0 8px 24px rgba(95,61,196,.12); position: sticky; top: 8px; z-index: 5; }
  .tabs button { border: 0; background: transparent; border-radius: 12px; padding: 8px 2px; font-weight: 700; color: var(--muted); cursor: pointer; min-height: 52px; font-size: 13px; line-height: 1.25; }
  .tabs button span { display: block; font-size: 20px; }
  .tabs button.on { background: var(--brand); color: #fff; }
  @media (max-width: 520px) { .tabs { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .tools { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .inp, select.inp { width: 100%; height: 46px; border: 1.5px solid var(--line); border-radius: 12px; padding: 0 12px; background: #fff; font-size: 16px; }
  .inp:focus { outline: none; border-color: var(--brand); }
  .tools .inp { flex: 1; min-width: 180px; width: auto; }
  .b { border: 0; border-radius: 12px; padding: 10px 16px; font-weight: 700; cursor: pointer; min-height: 46px; background: #f3f0ff; color: var(--brand); white-space: nowrap; }
  .b.main { background: var(--brand); color: #fff; }
  .b.danger { background: #fff5f5; color: var(--bad); }
  .b:disabled { opacity: .5; }
  .group { margin-top: 18px; }
  .group h3 { margin: 0 4px 8px; font-size: 14px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .list { background: #fff; border-radius: var(--radius); overflow: hidden; box-shadow: 0 1px 0 var(--line), 0 6px 18px rgba(95,61,196,.05); }
  .item { all: unset; box-sizing: border-box; display: flex; gap: 12px; align-items: center; width: 100%; padding: 13px 16px; border-bottom: 1px solid #f3f0ff; cursor: pointer; min-height: 60px; }
  .item:last-child { border-bottom: 0; }
  .item:hover, .item:focus-visible { background: #faf8ff; }
  .ic { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; flex: none; font-size: 20px; }
  .item .t { flex: 1; min-width: 0; }
  .item .t b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .t small { display: block; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .r { text-align: right; white-space: nowrap; font-weight: 700; }
  .pill { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 9px; background: #f3f0ff; color: var(--brand); margin-left: 4px; }
  .neg { color: var(--neg); } .pos { color: var(--pos); } .mut { color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 30px; }
  .note { background: #fff9db; color: #7a4a00; border-radius: 12px; padding: 10px 12px; font-size: 13px; margin-top: 12px; }
  .sheet-bg { position: fixed; inset: 0; background: rgba(33,37,41,.45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
  .sheet { background: #fff; width: 100%; max-width: 560px; max-height: 92vh; border-radius: 24px 24px 0 0; display: flex; flex-direction: column; }
  @media (min-width: 700px) { .sheet-bg { align-items: center; } .sheet { border-radius: 24px; } }
  .sheet header { padding: 16px 18px 10px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .sheet header h2 { margin: 0; font-size: 18px; }
  .sheet .x { border: 0; background: var(--bg); width: 40px; height: 40px; border-radius: 50%; font-size: 18px; cursor: pointer; }
  .sheet .body { padding: 8px 18px 16px; overflow-y: auto; }
  .sheet footer { padding: 12px 18px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); display: flex; gap: 10px; }
  .sheet footer .b.main { flex: 1; }
  label.f { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 5px; }
  .g2 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 10px; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button { flex: 1; border: 1.5px solid var(--line); background: #fff; border-radius: 12px; padding: 10px 8px; cursor: pointer; font-weight: 600; min-height: 46px; }
  .seg button.on { border-color: var(--brand); background: #f3f0ff; color: var(--brand); }
  .checks { display: grid; gap: 6px; }
  .checks label { display: flex; gap: 10px; align-items: center; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; min-height: 46px; cursor: pointer; }
  .checks input { width: 20px; height: 20px; }
  .err { color: var(--bad); font-size: 14px; margin-top: 10px; min-height: 1em; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 14px; font-size: 14px; z-index: 40; max-width: 90vw; }
  .loading { text-align: center; padding: 50px; color: var(--muted); }
  /* ── จอใหญ่ Mac/PC: ขยายทั้งหน้า + ตัวอักษรเข้มคมขึ้น (มือถือ/iPad ไม่เปลี่ยน) ── */
  @media (min-width: 1024px) and (hover: hover) and (pointer: fine) {
    :root { --muted: #464c53; }
    html, body { -webkit-font-smoothing: auto; -moz-osx-font-smoothing: auto; }
    html { zoom: 1.1; }
  }
  @media (min-width: 1280px) and (hover: hover) and (pointer: fine) { html { zoom: 1.2; } }
  @media (min-width: 1600px) and (hover: hover) and (pointer: fine) { html { zoom: 1.3; } }
  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
  .sw { border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 8px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; align-items: stretch; font-weight: 600; font-size: 13px; min-height: 76px; }
  .sw i { display: block; height: 36px; border-radius: 10px; }
  .sw.on { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(95,61,196,.12); }
</style>
<script src="theme.js?v=1"></script>
</head>
<body>
<div class="top"><div class="wrap row">
  <div><h1>ตั้งค่า</h1><p id="sub">บัญชี · บริษัท · หมวด · คู่ค้า · สมาชิก</p></div>
  <nav class="nav" aria-label="เมนู"><a href="home.html">ภาพรวม</a><a href="index.html">รอเคลียร์</a><a href="cards.html">บัตร & เงินกู้</a><a href="assets.html">ทรัพย์สิน</a><a href="reports.html">รายงาน</a><a href="close.html">ปิดเดือน</a><a class="on" href="settings.html">ตั้งค่า</a><a href="../trip-unified-prototype/trips.html">ทริป</a></nav>
</div></div>
<main class="wrap">
  <div class="tabs" id="tabs" role="tablist">
    <button data-t="acc" class="on"><span>🏦</span>บัญชี</button><button data-t="ent"><span>🏢</span>บริษัท</button><button data-t="cat"><span>🗂️</span>หมวด</button>
    <button data-t="con"><span>👥</span>คู่ค้า</button><button data-t="usr"><span>👨‍👩‍👧</span>สมาชิก</button><button data-t="etc"><span>⚙️</span>อื่น ๆ</button>
  </div>
  <div id="view"><div class="loading">กำลังโหลด…</div></div>
</main>
<script>
/* ⏱️ ทุกคำขอมีเวลารอสูงสุด (2026-10-11) — เดิมถ้าเซิร์ฟเวอร์ค้าง หน้าจอหมุนไม่รู้จบ
   อ่านเอกสาร/statement ด้วย AI ใช้เวลานาน ให้รอได้ 3 นาที · อย่างอื่น 40 วินาที
   และแปลง error ให้อ่านรู้เรื่อง แทน "Failed to fetch" */
(function () {
  const orig = window.fetch.bind(window);
  window.fetch = (input, init = {}) => {
    if (init.signal || typeof AbortController === 'undefined') return orig(input, init);
    const url = typeof input === 'string' ? input : (input?.url || '');
    const ms = /\/(upload|statement|import|retry|backup|restore|ocr)/i.test(url) ? 180000 : 40000;
    const ac = new AbortController();
    const timer = setTimeout(() => ac.abort(), ms);
    return orig(input, { ...init, signal: ac.signal })
      .catch(err => {
        if (err?.name === 'AbortError') throw new Error('เซิร์ฟเวอร์ตอบช้าเกินไป — ลองใหม่อีกครั้ง');
        if (err instanceof TypeError) throw new Error('เชื่อมต่อไม่ได้ — ตรวจอินเทอร์เน็ตแล้วลองใหม่');
        throw err;
      })
      .finally(() => clearTimeout(timer));
  };
})();
</script>
<script>
(function () {
  'use strict';
  const API = (() => {
    const PROD = 'https://record-revenue.9nimz.workers.dev';
    try {
      const q = new URLSearchParams(location.search).get('api');
      if (q) sessionStorage.setItem('api_base_override', q);
      const o = sessionStorage.getItem('api_base_override');
      if (o) return o.replace(/\/$/, '');
      if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') return 'http://localhost:8787';
    } catch (e) { /* ใช้ของจริง */ }
    return PROD;
  })();
  const token = () => { try { return localStorage.getItem('session_token') || sessionStorage.getItem('session_token') || ''; } catch { return ''; } };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = n => Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmt = n => Number(n) < 0 ? `(${money(-n)})` : money(n);
  const $ = s => document.querySelector(s);
  const view = $('#view');
  const plain = n => String(n || '').replace(/^\s*\[[^\]]+\]\s*/, '').trim() || String(n || '');
  const hasCode = n => /^\s*\[[^\]]+\]/.test(String(n || ''));
  /* ชื่อที่บันทึก: รายการใหม่ หรือชื่อเดิมมี [ID] → "[ID] ชื่อ" · ชื่อเดิมไม่มี → ตามที่พิมพ์ */
  const withCode = (id, name, orig) => (orig === undefined || hasCode(orig)) ? `[${id}] ${name}` : name;
  /* เดารหัสถัดไปจากรหัสที่มีอยู่ (A01, A02 … → A03) */
  function nextId(ids, prefix) {
    const groups = new Map();
    for (const id of ids) { const m = String(id).match(/^(.*?)(\d+)$/); if (m) { const g = groups.get(m[1]) || { n: 0, max: 0, w: m[2].length }; g.n++; g.max = Math.max(g.max, +m[2]); g.w = Math.max(g.w, m[2].length); groups.set(m[1], g); } }
    let p = prefix, g = prefix != null ? groups.get(prefix) : null;
    if (prefix == null) { for (const [k, v] of groups) if (!g || v.n > g.n) { g = v; p = k; } }
    if (!g) return `${p || 'X'}01`;
    return `${p}${String(g.max + 1).padStart(g.w, '0')}`;
  }
  const BEH = { REVENUE: ['รายรับ', '#087f5b', '#e6fcf5'], EXPENSE: ['รายจ่าย', '#c92a2a', '#fff5f5'], ASSET: ['สินทรัพย์ / ลูกหนี้', '#0b7285', '#e3fafc'],
    LIABILITY: ['หนี้สิน / เจ้าหนี้', '#9c36b5', '#f8f0fc'], TRANSFER: ['โอนระหว่างบัญชี', '#1c4fd6', '#edf2ff'], INVESTMENT: ['ลงทุน', '#e8590c', '#fff4e6'] };
  const behOf = cp => cp?.sub_behavior === 'INVESTMENT' ? 'INVESTMENT' : (cp?.behavior || 'EXPENSE');
  const ACC_T = { BANK: ['🏦', 'ธนาคาร', '#edf2ff'], CASH: ['🪙', 'เงินสด', '#fff9db'], CREDIT: ['💳', 'บัตรเครดิต', '#fff5f5'] };
  const CON_T = { CUSTOMER: 'ลูกค้า', VENDOR: 'ผู้ขาย / ร้านค้า', OTHER: 'อื่น ๆ' };
  const S = { tab: 'acc', q: '', st: null, users: [], me: null };

  function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
  async function api(path, body) {
    const res = await fetch(API + path, { method: body ? 'POST' : 'GET', headers: { Authorization: `Bearer ${token()}`, ...(body ? { 'Content-Type': 'application/json' } : {}) }, body: body ? JSON.stringify(body) : undefined });
    if (res.status === 401) throw Object.assign(new Error('กรุณาเข้าสู่ระบบ'), { login: true });
    const d = await res.json().catch(() => ({}));
    if (!res.ok || d.error) throw new Error(d.error || `ผิดพลาด (${res.status})`);
    return d;
  }
  function sheet(title, html, footer) {
    const bg = document.createElement('div'); bg.className = 'sheet-bg';
    bg.innerHTML = `<div class="sheet" role="dialog" aria-label="${esc(title)}"><header><h2>${esc(title)}</h2><button class="x" data-close aria-label="ปิด">✕</button></header><div class="body">${html}<div class="err" data-err></div></div><footer>${footer}</footer></div>`;
    const close = () => bg.remove();
    bg.addEventListener('click', e => { if (e.target === bg || e.target.closest('[data-close]')) close(); });
    document.addEventListener('keydown', function k(e) { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', k); } });
    document.body.appendChild(bg);
    const el = bg.querySelector('.sheet');
    return { el, close, err: t => { el.querySelector('[data-err]').textContent = t; }, v: id => el.querySelector('#' + id)?.value?.trim() ?? '' };
  }
  const isAdmin = () => S.me?.role === 'admin';

  async function load() {
    if (!token()) { view.innerHTML = `<div class="empty"><h3>ยังไม่ได้เข้าสู่ระบบ</h3><a href="../index.html">ไปหน้าเข้าสู่ระบบ</a></div>`; return; }
    try {
      const [st, users] = await Promise.all([api('/api/settings'), api('/api/users').catch(() => [])]);
      S.st = st; S.users = Array.isArray(users) ? users : [];
      let meId = ''; try { meId = JSON.parse(localStorage.getItem('logged_in_user') || sessionStorage.getItem('logged_in_user') || '{}').user_id || ''; } catch { /* ไม่มี */ }
      S.me = S.users.find(u => u.user_id === meId) || null;
      render();
    } catch (e) { view.innerHTML = `<div class="empty">โหลดไม่สำเร็จ: ${esc(e.message)}</div>`; }
  }
  $('#tabs').onclick = e => { const b = e.target.closest('button[data-t]'); if (!b) return; S.tab = b.dataset.t; S.q = ''; document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b)); render(); };
  const tools = (ph, addLabel) => `<div class="tools"><input class="inp" id="q" placeholder="🔎 ${ph}" value="${esc(S.q)}" aria-label="ค้นหา">${addLabel ? `<button class="b main" id="add">${addLabel}</button>` : ''}</div>`;
  const match = (...xs) => !S.q || xs.join(' ').toLowerCase().includes(S.q.toLowerCase());
  function bindTools(onAdd) {
    const q = $('#q'); if (q) q.oninput = () => { S.q = q.value; const p = q.selectionStart; render(); const n = $('#q'); n.focus(); n.setSelectionRange(p, p); };
    $('#add')?.addEventListener('click', onAdd);
  }
  function render() { ({ acc: renderAcc, ent: renderEnt, cat: renderCat, con: renderCon, usr: renderUsr, etc: renderEtc })[S.tab](); }
  /* ล้างข้อมูลหลักที่แอปหลักจำไว้ (mdcache:) ให้ dropdown เห็นของใหม่ */
  const clearMasterCache = () => { try { Object.keys(sessionStorage).filter(k => k.startsWith('mdcache:')).forEach(k => sessionStorage.removeItem(k)); } catch { /* ไม่เป็นไร */ } };
  async function save(sh, payload, msg) {
    try { await api('/api/settings/save', payload); clearMasterCache(); sh.close(); toast(msg || '✅ บันทึกแล้ว'); await load(); }
    catch (e) { sh.err(e.message); sh.el.querySelectorAll('footer button').forEach(b => { b.disabled = false; }); }
  }
  async function del(sh, type, id, label) {
    if (!window.confirm(`ลบ "${label}" ?`)) return;
    try { await api('/api/settings/delete', { type, id }); clearMasterCache(); sh.close(); toast('🗑️ ลบแล้ว'); await load(); } catch (e) { sh.err(e.message); }
  }
  const footer = (canDel) => `${canDel && isAdmin() ? '<button class="b danger" data-del>ลบ</button>' : ''}<button class="b main" data-save>บันทึก</button>`;

  // ── บัญชี ──
  function renderAcc() {
    const ents = S.st.entities || [];
    const accs = (S.st.accounts || []).filter(a => match(a.account_id, a.name, a.bank_name, a.entity_name));
    const byEnt = new Map();
    for (const a of accs) { const k = a.entity_id || '-'; if (!byEnt.has(k)) byEnt.set(k, []); byEnt.get(k).push(a); }
    view.innerHTML = tools('ค้นหาบัญชี ธนาคาร', '＋ เพิ่มบัญชี') + ([...byEnt.entries()].map(([eid, list]) => `
      <div class="group"><h3>${esc(plain(ents.find(e => e.entity_id === eid)?.name || eid))}<span>${list.length} บัญชี · ${fmt(list.reduce((t, a) => t + Number(a.balance || 0), 0))}</span></h3><div class="list">
      ${list.map(a => { const t = ACC_T[a.account_type] || ACC_T.BANK; return `<button class="item" data-id="${esc(a.account_id)}"><span class="ic" style="background:${t[2]}">${t[0]}</span>
        <span class="t"><b>${esc(plain(a.name))}</b><small>${esc(a.account_id)} · ${esc(a.bank_name || t[1])}${a.account_number ? ' · ' + esc(a.account_number) : ''}${a.pdf_password ? ' · 🔑' : ''}</small></span>
        <span class="r ${Number(a.balance) < 0 ? 'neg' : ''}">${fmt(a.balance)}</span></button>`; }).join('')}</div></div>`).join('') || '<div class="empty">ไม่พบบัญชี</div>');
    bindTools(() => accForm(null));
    view.querySelectorAll('[data-id]').forEach(b => b.onclick = () => accForm((S.st.accounts || []).find(a => a.account_id === b.dataset.id)));
  }
  function accForm(a) {
    const ents = S.st.entities || [];
    let type = a?.account_type || 'BANK';
    const ids = (S.st.accounts || []).map(x => x.account_id);
    const sh = sheet(a ? 'แก้ไขบัญชี' : 'เพิ่มบัญชี', `
      <label class="f">ประเภท</label><div class="seg" id="aT">${Object.entries(ACC_T).map(([k, t]) => `<button type="button" data-v="${k}" class="${type === k ? 'on' : ''}">${t[0]} ${t[1]}</button>`).join('')}</div>

      <span class="t"><b>${esc(plain(e.name))}</b><small>${esc(e.entity_id)} · ${e.is_company ? 'นิติบุคคล' : 'ส่วนตัว'} · ${accN(e.entity_id)} บัญชี</small></span>
      <span class="r mut" style="font-weight:500;font-size:13px">👤 ${esc(eu.filter(x => x.entity_id === e.entity_id).map(x => x.user_name).join(', ') || '-')}</span></button>`).join('') || '<div class="empty">ไม่พบ</div>'}</div></div>

  function entForm(e) {
    const holders = new Set((S.st.entity_users || []).filter(x => x.entity_id === e?.entity_id).map(x => x.user_id));
    if (!e && S.me) holders.add(S.me.user_id);
    const sh = sheet(e ? 'แก้ไขบริษัท' : 'เพิ่มบริษัท', `
      <div class="g2"><div><label class="f" for="eId">รหัส</label><input class="inp" id="eId" value="${esc(e?.entity_id || nextId((S.st.entities || []).map(x => x.entity_id)))}" ${e ? 'readonly' : ''}></div>
        <div><label class="f">ประเภท</label><div class="seg" id="eT"><button type="button" data-v="1" class="${e?.is_company ? 'on' : ''}">🏢 บริษัท</button><button type="button" data-v="0" class="${e && !e.is_company ? 'on' : (!e ? 'on' : '')}">🏠 ส่วนตัว</button></div></div></div>

      <label class="f">สมาชิกที่ถือ / เห็นบริษัทนี้</label><div class="checks">${S.users.map(u => `<label><input type="checkbox" value="${esc(u.user_id)}" ${holders.has(u.user_id) ? 'checked' : ''}> ${esc(u.name)} <span class="mut">(${u.role === 'admin' ? 'ผู้ดูแล' : 'สมาชิก'})</span></label>`).join('')}</div>
      ${e ? '<div class="note">ลบได้เฉพาะบริษัทที่ไม่มีบัญชีผูกอยู่</div>' : ''}`, footer(!!e));

    sh.el.querySelectorAll('#eT [data-v]').forEach(b => b.onclick = () => { isCo = +b.dataset.v; sh.el.querySelectorAll('#eT [data-v]').forEach(x => x.classList.toggle('on', x === b)); });
    sh.el.querySelector('[data-save]').onclick = () => {
      const id = sh.v('eId'), name = sh.v('eName');
      const members = [...sh.el.querySelectorAll('.checks input:checked')].map(i => i.value);
      if (!id || !name) return sh.err('ใส่รหัสและชื่อ');
      if (!members.length) return sh.err('เลือกสมาชิกอย่างน้อย 1 คน');
      if (S.me && e && holders.has(S.me.user_id) && !members.includes(S.me.user_id) && !window.confirm('คุณเอาตัวเองออกจากบริษัทนี้ — จะมองไม่เห็นบัญชีของบริษัทนี้อีก ยืนยัน?')) return;

    };

  }

  // ── หมวด (หัวข้อ → หมวด) ──
  function renderCat() {
    const caps = S.st.captions || [], cats = S.st.categories || [];
    const order = ['REVENUE', 'EXPENSE', 'ASSET', 'LIABILITY', 'INVESTMENT', 'TRANSFER'];
    const capsSorted = [...caps].sort((a, b) => order.indexOf(behOf(a)) - order.indexOf(behOf(b)) || String(a.name).localeCompare(String(b.name), 'th'));
    view.innerHTML = tools('ค้นหาหมวด', '＋ เพิ่มหัวข้อ') + capsSorted.map(cp => {
      const list = cats.filter(c => c.caption_id === cp.type_id && match(c.category_id, c.name, cp.name));
      if (S.q && !list.length && !match(cp.name)) return '';
      const [label, col, soft] = BEH[behOf(cp)] || BEH.EXPENSE;
      return `<div class="group"><h3><span><button class="b" style="min-height:36px;padding:6px 10px;background:${soft};color:${col}" data-cap="${esc(cp.type_id)}">${esc(plain(cp.name))} ✎</button> <span class="pill" style="background:${soft};color:${col}">${label}</span></span>
        <button class="b" style="min-height:36px;padding:6px 12px" data-addcat="${esc(cp.type_id)}">＋ หมวด</button></h3>
        <div class="list">${list.map(c => `<button class="item" data-cat="${esc(c.category_id)}"><span class="t"><b>${esc(plain(c.name))}</b><small>${esc(c.category_id)}${c.default_type ? ' · ' + ({ INCOME: 'รายรับ', EXPENSE: 'รายจ่าย', TRANSFER: 'โอน' }[c.default_type] || c.default_type) : ''}</small></span><span class="r mut">›</span></button>`).join('') || '<div class="empty" style="padding:14px">ยังไม่มีหมวด</div>'}</div></div>`;
    }).join('');
    bindTools(() => capForm(null));
    view.querySelectorAll('[data-cap]').forEach(b => b.onclick = () => capForm(caps.find(c => c.type_id === b.dataset.cap)));
    view.querySelectorAll('[data-addcat]').forEach(b => b.onclick = () => catForm(null, b.dataset.addcat));
    view.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => catForm(cats.find(c => c.category_id === b.dataset.cat)));
  }

  /* ── อื่น ๆ: สำรอง/กู้ข้อมูล · โปรเจกต์ (ย้ายจากหน้าเดิม 2026-10-11) ── */
  const BACKUP_SHEETS = [['Transactions', 'transactions'], ['TransactionDetails', 'transaction_details'], ['Settlements', 'settlements'], ['Debts', 'debts'],
    ['Contacts', 'contacts'], ['Projects', 'projects'], ['Entities', 'entities'], ['Accounts', 'accounts'], ['Categories', 'categories'], ['Captions', 'captions'],
    ['TripStops', 'trip_stops'], ['TripExpenses', 'trip_expenses'], ['UserPermissions', 'user_permissions']];
  async function loadXlsx() {
    if (window.XLSX) return;
    const add = src => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
    try { await add('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'); }
    catch { try { await add('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'); } catch { throw new Error('โหลดตัวสร้าง Excel ไม่สำเร็จ ลองรีเฟรชหน้า'); } }
  }
  async function doBackup(btn) {
    btn.disabled = true; const old = btn.innerHTML; btn.innerHTML = '⏳ กำลังสำรอง…';
    try {
      await loadXlsx();
      const db = await api('/api/backup/full');
      const X = window.XLSX, wb = X.utils.book_new();
      X.utils.book_append_sheet(wb, X.utils.json_to_sheet([{ ข้อมูล: 'Exported At', ค่า: db.exported_at }, { ข้อมูล: 'Family ID', ค่า: db.family_id }, { ข้อมูล: 'Exported By', ค่า: S.me?.name || '' },
        ...BACKUP_SHEETS.map(([sh, k]) => ({ ข้อมูล: `จำนวน ${sh}`, ค่า: (db[k] || []).length + ' rows' }))]), '_Info');
      for (const [sh, k] of BACKUP_SHEETS) { const rows = db[k] || []; X.utils.book_append_sheet(wb, rows.length ? X.utils.json_to_sheet(rows) : X.utils.aoa_to_sheet([['(ไม่มีข้อมูล)']]), sh); }
      X.writeFile(wb, `RecordRevenue_Backup_${new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-')}.xlsx`);
      toast(`💾 สำรองแล้ว · ${(db.transactions || []).length.toLocaleString()} รายการ`);
      btn.disabled = false; btn.innerHTML = old; return true;
    } catch (e) { toast('⚠️ สำรองไม่สำเร็จ: ' + e.message); }
    btn.disabled = false; btn.innerHTML = old; return false;
  }
  function restoreForm() {
    let mode = 'upsert';
    const sh = sheet('กู้ข้อมูลจากไฟล์สำรอง', `
      <label class="f">ไฟล์สำรอง (.xlsx จากปุ่ม "สำรองข้อมูล")</label><input class="inp" id="rFile" type="file" accept=".xlsx" style="padding-top:10px">
      <label class="f">วิธีกู้</label><div class="seg" id="rM"><button type="button" data-v="upsert" class="on">➕ เพิ่ม/อัปเดต (ไม่ลบของเดิม)</button><button type="button" data-v="replace">⚠️ แทนที่ทั้งหมด</button></div>
      <div class="note" id="rNote">เพิ่มรายการที่ยังไม่มี และอัปเดตรายการที่รหัสตรงกัน — ของเดิมที่ไม่มีในไฟล์ยังอยู่</div>
      <div class="note">ถ้ามีเดือนที่ปิดบัญชีแล้ว ต้องเปิดเดือนก่อนจึงจะกู้ได้</div>`, `<button class="b main" data-save>เริ่มกู้ข้อมูล</button>`);
    sh.el.querySelector('#rM').onclick = e => { const b = e.target.closest('button[data-v]'); if (!b) return; mode = b.dataset.v;
      sh.el.querySelectorAll('#rM button').forEach(x => x.classList.toggle('on', x === b));
      sh.el.querySelector('#rNote').textContent = mode === 'replace' ? 'ลบข้อมูลการเงินและข้อมูลหลักของครอบครัวทั้งหมด แล้วใส่จากไฟล์ — ข้อมูลจะกลับไปตรงกับไฟล์เป๊ะ (สมาชิกไม่ถูกลบ)' : 'เพิ่มรายการที่ยังไม่มี และอัปเดตรายการที่รหัสตรงกัน — ของเดิมที่ไม่มีในไฟล์ยังอยู่'; };
    sh.el.querySelector('[data-save]').onclick = async e => {
      const f = sh.el.querySelector('#rFile').files[0];
      if (!f) return sh.err('เลือกไฟล์ก่อน');
      if (mode === 'replace') {
        if (!window.confirm(`⚠️ แทนที่ทั้งหมด\n\nลบข้อมูลเดิมทั้งหมดของครอบครัว แล้วใส่จาก "${f.name}"\nแถวที่ไม่มีในไฟล์จะหายถาวร — ดำเนินการต่อ?`)) return;
        if (window.prompt('พิมพ์  RESET  เพื่อยืนยัน') !== 'RESET') return toast('ยกเลิก');
      } else if (!window.confirm(`กู้ข้อมูลจาก "${f.name}" แบบเพิ่ม/อัปเดต?`)) return;
      e.target.disabled = true; sh.err('');
      try {
        await loadXlsx();
        const wb = window.XLSX.read(new Uint8Array(await f.arrayBuffer()), { type: 'array' });
        const payload = {};
        for (const [name, key] of BACKUP_SHEETS) { if (!wb.SheetNames.includes(name)) continue; const rows = window.XLSX.utils.sheet_to_json(wb.Sheets[name]); if (rows.length && !(rows.length === 1 && Object.values(rows[0])[0] === '(ไม่มีข้อมูล)')) payload[key] = rows; }
        if (!Object.keys(payload).length) throw new Error('ไม่พบชีตข้อมูลในไฟล์ — ใช่ไฟล์จากปุ่มสำรองข้อมูลไหม');
        if (mode === 'replace') payload.mode = 'replace';
        e.target.textContent = '⏳ กำลังกู้… (อาจใช้เวลาหลายนาที)';
        let out;
        try { out = await api('/api/restore/full', payload); }
        catch (err) {
          if (!/น้อยกว่าครึ่ง/.test(err.message) || !window.confirm(`⚠️ ${err.message}\n\nยืนยันแทนที่ด้วยไฟล์นี้?`)) throw err;
          payload.confirm_shrink = true; out = await api('/api/restore/full', payload);
        }
        sh.close();
        try { Object.keys(sessionStorage).filter(k => k.startsWith('mdcache:')).forEach(k => sessionStorage.removeItem(k)); } catch { /* */ }
        window.alert('✅ กู้ข้อมูลสำเร็จ\n\n' + Object.entries(out.stats || {}).map(([k, v]) => `${k}: ${v}`).join('\n'));
        await load();
      } catch (err) { sh.err(err.message); e.target.disabled = false; e.target.textContent = 'เริ่มกู้ข้อมูล'; }
    };
  }

  async function resetForm(scope) {
    let pv;
    try { pv = await api('/api/reset', { scope, preview: true }); } catch (e) { return toast('⚠️ ' + e.message); }
    const all = scope === 'all', closed = pv.closed_periods || [];
    const sh = sheet(all ? 'ล้างข้อมูลทั้งหมด' : 'ล้างเฉพาะรายการ', `
      <div class="note" style="background:#fff5f5;color:#a51111;margin-top:4px">⚠️ ลบถาวร กู้คืนไม่ได้ (ยกเว้นจากไฟล์สำรอง)</div>

        <div class="item" style="cursor:default"><span class="t"><b>${Number(pv.transactions).toLocaleString()} รายการ</b><small>รวมเอกสารรอเคลียร์ ${pv.docs} · statement ${pv.statements}</small></span></div>

      </div>
      ${closed.length ? `<div class="checks" style="margin-top:12px"><label><input type="checkbox" id="rC"> มี ${closed.length} เดือนที่ปิดบัญชีแล้ว (${closed.slice(0, 6).join(', ')}${closed.length > 6 ? ' …' : ''}) — ยอมให้ระบบเปิดเดือนแล้วลบด้วย</label></div>` : ''}
      <div class="checks" style="margin-top:10px"><label><input type="checkbox" id="rB" checked> ดาวน์โหลดไฟล์สำรอง Excel ก่อนล้าง (แนะนำ)</label></div>
      <label class="f" for="rT">พิมพ์คำว่า <b>RESET</b> (ตัวใหญ่) เพื่อยืนยัน</label><input class="inp" id="rT" autocomplete="off" autocapitalize="characters" placeholder="RESET">`,
      `<button class="b danger" data-go style="flex:1">${all ? '💣 ล้างทั้งหมด' : '🧹 ล้างรายการ'}</button>`);
    const go = sh.el.querySelector('[data-go]');
    go.onclick = async () => {

      if (closed.length && !sh.el.querySelector('#rC').checked) return sh.err('ติ๊กยืนยันเรื่องเดือนที่ปิดแล้วก่อน');
      go.disabled = true; sh.err('');

        <a class="item" href="opening.html" style="text-decoration:none;color:inherit"><span class="ic" style="background:#e7f5ff">⚖️</span><span class="t"><b>ยอดยกมา</b><small>เริ่มใช้ระบบ: ยอดบัญชี ลูกหนี้/เจ้าหนี้ หนี้สิน สินทรัพย์ (เดบิต = เครดิต)</small></span><span class="r mut">›</span></a>
        <a class="item" href="reports.html" style="text-decoration:none;color:inherit"><span class="ic" style="background:#e6fcf5">⬇️</span><span class="t"><b>ส่งออกรายการเป็น Excel</b><small>หน้ารายงาน · แท็บส่งออก</small></span><span class="r mut">›</span></a>
        <a class="item" href="index.html" style="text-decoration:none;color:inherit"><span class="ic" style="background:#f3f0ff">📊</span><span class="t"><b>นำเข้า Excel / Bulk</b><small>กล่องรอเคลียร์ · ปุ่มนำเข้า Excel</small></span><span class="r mut">›</span></a>
        <a class="item" href="close.html" style="text-decoration:none;color:inherit"><span class="ic" style="background:#fff9db">🔒</span><span class="t"><b>ปิดเดือน</b><small>ตรวจยอดกับ statement แล้วล็อกเดือน</small></span><span class="r mut">›</span></a>
      </div></div>
      <div class="group"><h3>🎨 ธีมสี <span class="mut" style="font-weight:500;font-size:13px">จำไว้ในเครื่องนี้</span></h3><div class="list" style="padding:12px">
        <div class="swatches">${Object.entries(window.LEDGER_THEMES || {}).map(([id, t]) => `<button class="sw ${window.LEDGER_THEME === id ? 'on' : ''}" data-theme="${esc(id)}" aria-pressed="${window.LEDGER_THEME === id}">
          <i style="background:linear-gradient(135deg, ${t.c[0]}, ${t.c[1]} 60%, ${t.c[2]})"></i><span>${esc(t.name)}</span></button>`).join('')}</div>
      </div></div>
      ${isAdmin() ? `<div class="group"><h3 style="color:var(--bad)">🧨 ล้างข้อมูล <span class="pill">เฉพาะผู้ดูแล</span></h3><div class="list">
        <button class="item" data-reset="transactions"><span class="ic" style="background:#fff9db">🧹</span><span class="t"><b>ล้างเฉพาะรายการ</b><small>ลบรายการทั้งหมด เอกสารรอเคลียร์ statement · เก็บบัญชี หมวด บริษัท คู่ค้า สมาชิก</small></span><span class="r mut">›</span></button>
        <button class="item" data-reset="all"><span class="ic" style="background:#fff5f5">💣</span><span class="t"><b class="neg">ล้างข้อมูลทั้งหมด เริ่มต้นใหม่</b><small>ลบทุกอย่างของครอบครัว เหลือแค่สมาชิก</small></span><span class="r mut">›</span></button>
      </div></div>` : ''}
      <div class="note">ผู้ใช้ปัจจุบัน: ${esc(S.me?.name || '-')} (${S.me?.role === 'admin' ? 'ผู้ดูแล' : 'สมาชิก'})</div>`;
    view.querySelectorAll('[data-theme]').forEach(b => b.onclick = () => window.setLedgerTheme && window.setLedgerTheme(b.dataset.theme));
    view.querySelectorAll('[data-reset]').forEach(b => b.onclick = () => resetForm(b.dataset.reset));
    $('#bk')?.addEventListener('click', e => doBackup(e.currentTarget));
    $('#rs')?.addEventListener('click', restoreForm);
    $('#addP')?.addEventListener('click', () => projForm(null));
    view.querySelectorAll('[data-p]').forEach(b => b.onclick = () => isAdmin() ? projForm(projects.find(p => p.project_id === b.dataset.p)) : null);
  }

  load();
})();
</script>
</body>
</html>
