<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ทริปทั้งหมด — Enjoy Life Trip</title>
  <link rel="icon" type="image/png" href="art/enjoy-life-trip-icon-v1.png">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="../puppup-prototype/fonts/noto-sans-thai-looped-thai-600-normal.woff2">
  <link rel="stylesheet" href="style.css?v=167">
  <link rel="stylesheet" href="themes.css?v=18">
  <link rel="stylesheet" href="trips.css?v=20">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@300;400;500;600;700&display=swap" rel="stylesheet">   <!-- ฟอนต์ Mali ทั้งแอป (2026-10-31) -->
    <link rel="stylesheet" href="../font-mali.css?v=2">
</head>
<body>
  <div class="app-shell trips-shell">
    <main class="workspace" style="grid-column:1/-1">
      <header class="topbar">
        <button class="back" id="tripsBack"><span aria-hidden="true">‹</span> เมนูหลัก</button>
        <div class="trips-brand"><b>Enjoy Life Trip ✨</b><small>บอร์ดรวมทริปและความทรงจำ</small></div>
        <div class="top-actions"><button class="primary-btn" id="newTripTop">＋ สร้างทริป</button></div>
      </header>

      <section class="screen active trips-board">
        <div id="tripsLoginNotice" class="privacy-note" hidden>
          ยังไม่ได้ล็อกอิน — เปิดแอปหลักแล้วล็อกอินก่อน จากนั้นกดเมนู "Enjoy Life Trip" ใหม่อีกครั้งในแท็บเดิม
        </div>

        <div id="tripsError" class="privacy-note" style="background:#fde8ee;border-color:#e86f91" hidden></div>

        <div class="trips-note">
          <div><h1>ทริปที่กำลังรอเราอยู่ ✈️</h1><p>เลือกทริปเพื่อวางแผนต่อ หรือกลับไปเปิดความทรงจำที่ผ่านมา</p></div>
          <div class="day-tabs" id="tripStageTabs">
            <button class="active" data-stage="ONGOING"><span class="stage-icon">🧭</span><span class="stage-copy"><b>กำลังเตรียม</b><small>Ongoing</small></span></button>
            <button data-stage="DREAM"><span class="stage-icon">💭</span><span class="stage-copy"><b>ทริปในฝัน</b><small>Dream</small></span></button>
            <button data-stage="MEMORY"><span class="stage-icon">📸</span><span class="stage-copy"><b>ความทรงจำ</b><small>Memory</small></span></button>
          </div>
        </div>

        <!-- ปุ่มลัดเข้าทริปล่าสุด — แทนการเด้งอัตโนมัติที่เอาออกไปแล้ว -->
        <div id="tripsShortcut" class="trips-shortcut" hidden></div>

        <div id="tripsLoading" class="trip-pick-empty">กำลังโหลดรายการทริป…</div>
        <div id="tripsGrid" class="trip-pick-grid" hidden></div>
        <div id="tripsEmpty" class="trip-pick-empty" hidden></div>
      </section>
    </main>
  </div>

  <button class="mobile-fab" id="newTripFab" style="display:block">＋ เพิ่มทริป</button>

  <!-- ===== สร้างทริปใหม่ ===== -->
  <div class="sheet-mask" id="newTripMask"></div>
  <div class="dialog" id="newTripDialog">
    <button class="dialog-close" id="newTripClose">✕</button>
    <h2 style="font:800 22px Sarabun;margin:0 0 14px">เพิ่มทริปใหม่</h2>
    <form id="newTripForm" style="display:grid;gap:12px">
      <label style="display:grid;gap:5px;font-weight:700">
        ชื่อทริป
        <input type="text" id="newTripName" placeholder="เช่น ทริปเกาะหลีเป๊ะ" required
         >
      </label>
      <div class="date-pair" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <label style="display:grid;gap:5px;font-weight:700">
          วันเริ่ม (ถ้ารู้แล้ว)
          <input type="date" id="newTripStart">
        </label>
        <label style="display:grid;gap:5px;font-weight:700">
          วันจบ
          <input type="date" id="newTripEnd">
        </label>
      </div>
      <label style="display:grid;gap:5px;font-weight:700">
        ประเภททริป
        <select id="newTripStage">
          <option value="DREAM" selected>💭 Dream — ยังไม่แน่นอน</option>
          <option value="ONGOING">🧭 Ongoing — จะเกิดแน่ ๆ</option>
        </select>
      </label>
      <p id="newTripError" style="color:#d65b69;font-size:13px;margin:0" hidden></p>
      <div class="sheet-actions" style="justify-content:flex-end;margin-top:4px">
        <button type="button" class="soft-btn" id="newTripCancel">ยกเลิก</button>
        <button type="submit" class="primary-btn" id="newTripSubmit">สร้างทริป</button>
      </div>
    </form>
  </div>

  <script src="api.js?v=53"></script>
  <script src="trips.js?v=9"></script>
</body>
</html>
