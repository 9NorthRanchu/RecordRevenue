<!doctype html><html lang="th"><head><meta charset="utf-8">
<link rel="stylesheet" href="prototype.css">
<style>
body{background:#EEEAE4;padding:26px;display:flex;flex-direction:column;align-items:center;gap:14px}
.cap{width:869px;font:600 24px 'Poppins','Anuphan';color:#16294D}
.phone{width:869px;border-radius:44px;overflow:hidden;background:#fff;box-shadow:0 20px 50px rgba(40,30,60,.18);margin-bottom:30px}
.maphero{position:relative;overflow:hidden;background:#cfe7f2}
.maphero .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.triprow{display:flex;align-items:center;justify-content:space-between;padding:20px 26px}
.triprow .l b{font:700 24px 'Anuphan';color:#16294D;display:flex;align-items:center;gap:8px}
.triprow .l small{display:block;margin-top:4px;font:600 14px 'Anuphan';color:#F58BAD}
.triprow .r span{background:#F3F1EC;border-radius:20px;padding:8px 14px;font:600 14px 'Anuphan';color:#16294D;display:flex;align-items:center;gap:6px}
</style></head><body>

<div class="cap">470px — ครอปโฟกัสเมืองในทริป (เท่ากับอีก 3 หน้า)</div>
<div class="phone">
  <div class="maphero" style="height:470px">
    <img class="bg" src="art/cmp_470.png">
    <div class="statusbar"><div class="t">9:41</div></div>
    <svg class="route" viewBox="0 0 869 470" id="r1"></svg>
    <div id="p1"></div>
  </div>
  <div class="triprow"><div class="l"><b>Hokkaido Winter Trip</b><small>22–27 มกราคม 2026</small></div><div class="r"><span>4</span></div></div>
</div>

<div class="cap">652px — เต็มภาพทั้งเกาะ ไม่ตัดอะไรเลย</div>
<div class="phone">
  <div class="maphero" style="height:652px">
    <img class="bg" src="art/cmp_652.png">
    <div class="statusbar"><div class="t">9:41</div></div>
    <svg class="route" viewBox="0 0 869 652" id="r2"></svg>
    <div id="p2"></div>
  </div>
  <div class="triprow"><div class="l"><b>Hokkaido Winter Trip</b><small>22–27 มกราคม 2026</small></div><div class="r"><span>4</span></div></div>
</div>

<script>
const pinSvg = (c, d) => `<svg width="66" height="96" viewBox="0 0 66 96">
  <g fill="none" stroke="#fff" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
    <path d="M33 4C17.9 4 5.6 16.3 5.6 31.4 5.6 47.2 33 74 33 74s27.4-26.8 27.4-42.6C60.4 16.3 48.1 4 33 4z"/>
    <path d="M33 72v13"/><ellipse cx="33" cy="87.5" rx="13" ry="5.4"/></g>
  <ellipse cx="33" cy="87.5" rx="13" ry="5.4" fill="${d}"/>
  <path d="M33 70v16" stroke="${d}" stroke-width="5" stroke-linecap="round"/>
  <path d="M33 4C17.9 4 5.6 16.3 5.6 31.4 5.6 47.2 33 74 33 74s27.4-26.8 27.4-42.6C60.4 16.3 48.1 4 33 4z" fill="${c}"/>
  <circle cx="33" cy="30.4" r="11" fill="#fff"/></svg>`;
function routePath(pts) {
  let d = `M${pts[0].x + 26} ${pts[0].y + 88}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    const x1 = a.x + 26, y1 = a.y + 88, x2 = b.x - 26, y2 = b.y + 88;
    const dx = (x2 - x1) * .45, sag = 26;
    d += ` C ${x1 + dx} ${y1 + sag}, ${x2 - dx} ${y2 + sag}, ${x2} ${y2}`;
  }
  return d;
}
function render(cities, pinsId, routeId){
  document.getElementById(pinsId).innerHTML = cities.map(c =>
    `<div class="pin" style="left:${c.x}px;top:${c.y}px">${pinSvg(c.color, c.dark)}<b>${c.name}</b><small>${c.from}–${c.to}</small></div>`).join('');
  const d = routePath(cities);
  document.getElementById(routeId).innerHTML = `
    <path d="${d}" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-dasharray="11 7"/>
    <path d="${d}" fill="none" stroke="#2F6BFF" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="11 7"/>`;
}
render([
  { name: 'Sounkyo',  from: '22 ม.ค.', to: '23 ม.ค.', color: '#7C63E0', dark: '#6A51CE', x: 376, y: 2 },
  { name: 'Lake Akan', from: '24 ม.ค.', to: '25 ม.ค.', color: '#EF5A85', dark: '#D94A73', x: 590, y: 152 },
  { name: 'Kushiro',  from: '26 ม.ค.', to: '27 ม.ค.', color: '#4CB682', dark: '#3AA271', x: 663, y: 299 },
], 'p1', 'r1');
render([
  { name: 'Sounkyo',  from: '22 ม.ค.', to: '23 ม.ค.', color: '#7C63E0', dark: '#6A51CE', x: 376, y: 68 },
  { name: 'Lake Akan', from: '24 ม.ค.', to: '25 ม.ค.', color: '#EF5A85', dark: '#D94A73', x: 590, y: 218 },
  { name: 'Kushiro',  from: '26 ม.ค.', to: '27 ม.ค.', color: '#4CB682', dark: '#3AA271', x: 663, y: 365 },
], 'p2', 'r2');
</script>
</body></html>
