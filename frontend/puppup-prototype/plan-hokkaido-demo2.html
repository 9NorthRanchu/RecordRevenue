<!doctype html><html lang="th"><head><meta charset="utf-8">
<link rel="stylesheet" href="prototype.css">
<style>
body{background:#EEEAE4;padding:26px;display:flex;justify-content:center}
.phone{width:869px;border-radius:44px;overflow:hidden;background:#fff;box-shadow:0 20px 50px rgba(40,30,60,.18)}
.maphero{position:relative;height:470px;overflow:hidden;background:#cfe7f2}
.maphero .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:var(--ox,50%) var(--oy,50%);transition:transform .35s cubic-bezier(.2,.8,.2,1);cursor:zoom-in}
.maphero.zoomed .bg{transform:scale(2.1);cursor:zoom-out}
.maphero.zoomed #pins,.maphero.zoomed #route{transform:scale(2.1);transform-origin:var(--ox,50%) var(--oy,50%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.zoomhint{position:absolute;right:22px;bottom:20px;background:rgba(22,41,77,.55);color:#fff;font:600 13px 'Anuphan';padding:8px 14px;border-radius:20px;display:flex;align-items:center;gap:6px;backdrop-filter:blur(4px)}
.triprow{display:flex;align-items:center;justify-content:space-between;padding:22px 26px 4px}
.triprow .l b{font:700 26px 'Anuphan';color:#16294D;display:flex;align-items:center;gap:8px}
.triprow .l small{display:block;margin-top:4px;font:600 15px 'Anuphan';color:#F58BAD}
.triprow .r{display:flex;gap:10px}
.triprow .r span{background:#F3F1EC;border-radius:20px;padding:8px 14px;font:600 14px 'Anuphan';color:#16294D;display:flex;align-items:center;gap:6px}
</style></head><body>
<div class="phone">
  <div class="maphero" id="hero">
    <img class="bg" id="bg" src="art/hero_plan_hokkaido_full.png" alt="">
    <div class="statusbar"><div class="t">9:41</div><div class="r"><svg width="90" height="24"><use href="#i-status"/></svg></div></div>
    <svg class="route" id="route" viewBox="0 0 869 470"></svg>
    <div id="pins"></div>
    <button class="pin-edit" id="pinEdit"><svg width="26" height="26"><use href="#i-move"/></svg>แก้หมุด</button>
    <div class="zoomhint" id="zoomHint">👆 แตะเพื่อซูม</div>
  </div>

  <div class="triprow">
    <div class="l"><b>Hokkaido Winter Trip <svg width="24" height="24"><use href="#i-heart"/></svg></b>
      <small>22–27 มกราคม 2026</small></div>
    <div class="r"><span><svg width="20" height="20"><use href="#i-user"/></svg>4</span></div>
  </div>
</div>

<svg style="display:none">
<symbol id="i-status" viewBox="0 0 90 24"><rect width="90" height="24" fill="none"/></symbol>
<symbol id="i-user" viewBox="0 0 28 28"><circle cx="14" cy="9" r="5" fill="currentColor"/><path d="M4 24c0-6 4.5-9 10-9s10 3 10 9" fill="currentColor"/></symbol>
<symbol id="i-heart" viewBox="0 0 32 32"><path d="M16 28S3 19 3 11a7 7 0 0 1 13-3 7 7 0 0 1 13 3c0 8-13 17-13 17z" fill="#F58BAD"/></symbol>
<symbol id="i-move" viewBox="0 0 26 26"><path d="M13 2v22M2 13h22" stroke="currentColor" stroke-width="2"/></symbol>
</svg>

<script>
const CITIES = [
  { name: 'Sounkyo',  from: '22 ม.ค.', to: '23 ม.ค.', color: '#7C63E0', dark: '#6A51CE', x: 385, y: 25 },
  { name: 'Lake Akan', from: '24 ม.ค.', to: '25 ม.ค.', color: '#EF5A85', dark: '#D94A73', x: 540, y: 133 },
  { name: 'Kushiro',  from: '26 ม.ค.', to: '27 ม.ค.', color: '#4CB682', dark: '#3AA271', x: 592, y: 239 },
];
const pinSvg = (c, d) => `<svg width="66" height="96" viewBox="0 0 66 96">
  <g fill="none" stroke="#fff" stroke-width="10" stroke-linejoin="round" stroke-linecap="round">
    <path d="M33 4C17.9 4 5.6 16.3 5.6 31.4 5.6 47.2 33 74 33 74s27.4-26.8 27.4-42.6C60.4 16.3 48.1 4 33 4z"/>
    <path d="M33 72v13"/><ellipse cx="33" cy="87.5" rx="13" ry="5.4"/></g>
  <ellipse cx="33" cy="87.5" rx="13" ry="5.4" fill="${d}"/>
  <path d="M33 70v16" stroke="${d}" stroke-width="5" stroke-linecap="round"/>
  <path d="M33 4C17.9 4 5.6 16.3 5.6 31.4 5.6 47.2 33 74 33 74s27.4-26.8 27.4-42.6C60.4 16.3 48.1 4 33 4z" fill="${c}"/>
  <circle cx="33" cy="30.4" r="11" fill="#fff"/></svg>`;
function routePath(pts) {
  if (pts.length < 2) return '';
  let d = `M${pts[0].x + 26} ${pts[0].y + 88}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    const x1 = a.x + 26, y1 = a.y + 88, x2 = b.x - 26, y2 = b.y + 88;
    const dx = (x2 - x1) * .45, sag = 26;
    d += ` C ${x1 + dx} ${y1 + sag}, ${x2 - dx} ${y2 + sag}, ${x2} ${y2}`;
  }
  return d;
}
document.getElementById('pins').innerHTML = CITIES.map(c =>
  `<div class="pin" style="left:${c.x}px;top:${c.y}px">${pinSvg(c.color, c.dark)}<b>${c.name}</b><small>${c.from}–${c.to}</small></div>`).join('');
const d = routePath(CITIES);
document.getElementById('route').innerHTML = `
  <path d="${d}" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-dasharray="11 7"/>
  <path d="${d}" fill="none" stroke="#2F6BFF" stroke-width="4.5" stroke-linecap="round" stroke-dasharray="11 7"/>`;

/* แตะเพื่อซูมเข้า/ออก จุดที่แตะ (แทน pinch บนเดสก์ท็อป) */
const hero = document.getElementById('hero');
hero.addEventListener('click', e => {
  if (e.target.closest('.pin') || e.target.closest('#pinEdit')) return;
  const r = hero.getBoundingClientRect();
  const ox = ((e.clientX - r.left) / r.width) * 100;
  const oy = ((e.clientY - r.top) / r.height) * 100;
  hero.style.setProperty('--ox', ox + '%');
  hero.style.setProperty('--oy', oy + '%');
  hero.classList.toggle('zoomed');
  document.getElementById('zoomHint').style.opacity = hero.classList.contains('zoomed') ? 0 : 1;
});
</script>
</body></html>
